<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Unified Singularity OS</title>
    <!-- Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons --><script src="https://unpkg.com/lucide@latest"></script>
    <!-- Load Chart.js for graphs --><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Load Three.js for 3D Globe --><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load D3.js for force-directed graphs --><script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* Custom Styles for Futuristic Look */
        :root {
            --primary-color: #f97316; /* Orange 600 (was Cyan 500) */
            --primary-glow: rgba(249, 115, 22, 0.5); /* Matching Orange Glow */
            --accent-color: #3b82f6; /* Blue 500 (was Violet 500) */
            --dark-bg-opaque: #111827; /* Gray 900 */
            --mid-bg-opaque: #1f2937; /* Gray 800 */
            --dark-bg-translucent: rgba(17, 24, 39, 0.85); /* Gray 900 with 85% opacity for backdrop-blur effect */
            --mid-bg-translucent: rgba(31, 41, 55, 0.85); /* Gray 800 with 85% opacity */
            --border-color: #374151; /* Gray 700 */
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg-opaque);
            color: #d1d5db; /* Gray 300 */
            overflow: hidden;
        }
        #background-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: black;
        }
        #background-container img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            filter: brightness(0.7);
        }
        #background-container img.active {
            opacity: 0.6; /* Made transparent (was 1) */
        }
        #app {
            backdrop-filter: blur(8px);
            background-color: var(--dark-bg-translucent);
        }
        .sidebar {
            background-color: var(--mid-bg-translucent);
            border-right: 1px solid var(--border-color);
            transition: width 0.3s ease, transform 0.3s ease;
        }
        .sidebar.collapsed {
            width: 4rem; /* 64px */
        }
        .sidebar.collapsed .nav-label,
        .sidebar.collapsed #system-title,
        .sidebar.collapsed #view-title,
        .sidebar.collapsed .nav-category {
            display: none;
        }
        .sidebar.collapsed .nav-link {
            justify-content: center;
        }
        .sidebar.collapsed .nav-link-icon {
            margin-right: 0;
        }
        .sidebar.collapsed #sidebar-logo-icon {
            margin-right: 0;
        }
        .sidebar.collapsed #sidebar-header {
             justify-content: center;
        }
        
        .main-content {
             transition: margin-left 0.3s ease;
        }

        .nav-link {
            transition: all 0.2s;
            position: relative;
        }
        .nav-link.active, .nav-link:hover {
            color: white;
            background-color: rgba(31, 41, 55, 0.5);
            border-left: 4px solid var(--primary-color);
            padding-left: calc(1rem - 4px);
        }
        .nav-link:not(.active) {
            border-left: 4px solid transparent;
            padding-left: 1rem;
        }
         .sidebar.collapsed .nav-link.active, .sidebar.collapsed .nav-link:hover {
            padding-left: 0;
            border-left: 4px solid var(--primary-color);
        }
        .sidebar.collapsed .nav-link:not(.active) {
            padding-left: 0;
            border-left: 4px solid transparent;
        }
        
        .card {
            background-color: var(--mid-bg-translucent);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        header, footer {
             background-color: var(--mid-bg-translucent);
        }
        .gauge-ring {
            stroke: var(--primary-color);
            transition: stroke-dashoffset 1s ease-out;
        }
        .gauge-bg {
            stroke: var(--border-color);
        }
        /* Scrollbar styles */
        .scrollbar-style::-webkit-scrollbar { width: 8px; }
        .scrollbar-style::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-style::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .scrollbar-style::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }

        /* Responsive Sidebar for Mobile */
        @media (max-width: 1023px) {
            .sidebar {
                transform: translateX(-100%);
                position: absolute;
                z-index: 50;
                height: 100vh;
                background-color: var(--mid-bg-opaque);
                width: 16rem !important; /* Force width on mobile */
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar.collapsed {
                transform: translateX(-100%);
            }
            .main-content {
                margin-left: 0 !important;
            }
            #sidebar-toggle-desktop {
                display: none;
            }
        }
        
        /* Animation keyframes */
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }
        @keyframes dash-flow {
            to { stroke-dashoffset: 1000; }
        }
        @keyframes pulse-glow {
            0%, 100% { 
                opacity: 0.8;
                text-shadow: 0 0 4px var(--primary-glow);
            }
            50% { 
                opacity: 1;
                text-shadow: 0 0 8px var(--primary-glow);
            }
        }
        .footer-pulse {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        
        /* Global Predictive Matrix map styles */
        .gpm-threat-arc {
            animation: dash-flow 1.2s linear infinite reverse;
        }
        .gpm-origin-pin:hover text {
            fill: #fff;
        }
        #gpm-landmass {
            transition: fill 0.3s ease;
        }
        #ucc-graph .link {
            stroke: var(--border-color);
            stroke-opacity: 0.6;
        }
        #ucc-graph .node {
            cursor: pointer;
            transition: transform 0.2s;
        }
        #ucc-graph .node:hover { transform: scale(1.1); }
        #ucc-graph .threat-link {
            stroke-dasharray: 4 2;
            animation: dash-flow 1.5s linear infinite reverse;
        }

        /* Quantum Computer Styles */
        .quantum-gate { cursor: grab; user-select: none; }
        .qubit-lane { border-bottom: 1px solid var(--border-color); }
        .gate-slot { border: 1px dashed var(--border-color); min-height: 40px; }
        .gate-slot.drag-over { background-color: var(--primary-glow); border-style: solid; }

        /* JAKAL reusable operator controls (js/jakal-controls.js) — cog, popover, dot/segmented/radial/slider */
        .jk-cog {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; padding: 0; border-radius: 6px;
            background: rgba(55, 65, 81, 0.6); border: 1px solid var(--border-color);
            color: #9ca3af; cursor: pointer; transition: background-color .15s, color .15s, border-color .15s;
        }
        .jk-cog:hover { background: rgba(249, 115, 22, 0.15); border-color: var(--primary-color); color: var(--primary-color); }
        .jk-pop {
            position: fixed; z-index: 9999; width: 420px; max-height: 70vh; overflow-y: auto;
            background: var(--dark-bg-translucent); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.55);
        }
        .jk-dot { display: inline-block; width: 34px; height: 18px; border-radius: 999px; cursor: pointer; position: relative; transition: background-color .15s; vertical-align: middle; }
        .jk-dot.off { background: #374151; }
        .jk-dot.on { background: #059669; }
        .jk-dot::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #e5e7eb; transition: transform .15s; }
        .jk-dot.on::after { transform: translateX(16px); }
        .jk-seg { display: inline-flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .jk-seg button { padding: 4px 10px; font-size: 11px; background: transparent; color: #9ca3af; border: none; cursor: pointer; }
        .jk-seg button.active { background: var(--primary-color); color: #fff; }
        .jk-seg button:not(.active):hover { background: rgba(255,255,255,.06); }
        .jk-radial { display: flex; flex-direction: column; gap: 4px; }
        .jk-radial label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #d1d5db; cursor: pointer; }
        .jk-slider { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 999px;
            background: linear-gradient(to right, var(--primary-color) 0%, var(--primary-color) var(--fill, 0%), #374151 var(--fill, 0%), #374151 100%); cursor: pointer; }
        .jk-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--primary-color); cursor: pointer; }
        .jk-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--primary-color); cursor: pointer; }

        /* Ontology Hub D3 styles */
        #ontology-graph-container .node { cursor: pointer; transition: transform 0.2s; }
        #ontology-graph-container .node:hover { transform: scale(1.2); }
        #ontology-graph-container .link {
            stroke-opacity: 0.6;
            stroke-dasharray: 5 5;
            animation: dash-flow 2s linear infinite;
        }
        
        /* Dashboard Tabs */
        .dashboard-tab {
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .dashboard-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .dashboard-tab-content {
             animation: fadeIn 0.5s ease-out forwards;
        }
        
        /* Settings Tab (within Dashboard) */
        .settings-nav-link {
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .settings-nav-link.active, .settings-nav-link:hover {
            background-color: var(--mid-bg-opaque);
            color: white;
            border-left-color: var(--primary-color);
        }

        /* ─── JAKAL Visual Polish v2.11 (Palantir/Anduril/IBM SOC patterns) ─── */
        /* Clarity over complexity: tighter hierarchy, calmer density, status vectors */

        .card {
            background: linear-gradient(180deg, rgba(31,41,55,0.92) 0%, rgba(17,24,39,0.95) 100%);
            border: 1px solid rgba(55,65,81,0.85);
            border-radius: 12px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(0,0,0,0.25);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
        }
        .card:hover {
            border-color: rgba(249,115,22,0.35);
            box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 28px rgba(0,0,0,0.3);
        }

        /* Status vector pills — color encodes state at a glance (Radware/IBM pattern) */
        .jakal-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid transparent;
            text-transform: capitalize;
        }
        .jakal-status::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 6px currentColor;
        }
        .jakal-status-healthy { color: #34d399; background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.35); }
        .jakal-status-warning { color: #fbbf24; background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.35); }
        .jakal-status-critical { color: #f87171; background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); }
        .jakal-status-unknown { color: #9ca3af; background: rgba(107,114,128,0.12); border-color: rgba(107,114,128,0.35); }

        /* Fleet / metric summary tiles */
        .jakal-metric-tile {
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(55,65,81,0.7);
            border-radius: 12px;
            padding: 16px 18px;
            text-align: center;
            transition: border-color 0.2s ease;
        }
        .jakal-metric-tile:hover { border-color: rgba(249,115,22,0.4); }
        .jakal-metric-tile .value {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        .jakal-metric-tile .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Device fleet cards — single-pane selection clarity (Anduril Lattice) */
        .jakal-device-card {
            background: rgba(17,24,39,0.65);
            border: 1px solid rgba(55,65,81,0.75);
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
        }
        .jakal-device-card:hover {
            background: rgba(31,41,55,0.85);
            border-color: rgba(249,115,22,0.45);
            transform: translateY(-1px);
        }
        .jakal-device-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px rgba(249,115,22,0.35), 0 8px 20px rgba(249,115,22,0.12);
            background: rgba(249,115,22,0.06);
        }
        .jakal-device-card .device-name {
            font-weight: 600;
            color: #f3f4f6;
            font-size: 13px;
        }
        .jakal-device-card .device-meta {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }
        .jakal-device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        /* Activity feed rows — progressive disclosure */
        .jakal-activity-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(55,65,81,0.45);
            font-size: 12px;
        }
        .jakal-activity-row:last-child { border-bottom: none; }
        .jakal-activity-row .ts { color: #6b7280; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .jakal-activity-row .evt { color: #e5e7eb; font-weight: 500; }
        .jakal-activity-row .ok { color: #34d399; }
        .jakal-activity-row .fail { color: #f87171; }

        /* Cleaner settings sub-nav */
        #settings-tabs-container {
            background: rgba(17,24,39,0.4);
        }
        .settings-nav-link {
            border-radius: 8px;
            margin-bottom: 2px;
        }
        .settings-nav-link.active {
            background: rgba(249,115,22,0.12) !important;
            color: #fdba74 !important;
        }

        /* Operator console chrome */
        #operator-console, .operator-console {
            border-color: rgba(249,115,22,0.35) !important;
            backdrop-filter: blur(12px);
        }

        /* Reduce visual noise on primary action buttons */
        button.bg-primary-color, .btn-primary {
            box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 4px 12px rgba(249,115,22,0.25);
        }
        button.bg-primary-color:hover {
            filter: brightness(1.08);
        }

        /* Section headers — F-pattern scanning aid */
        .jakal-section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        /* Live badge */
        .jakal-live-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 0 0 rgba(52,211,153,0.5);
            animation: jakal-live-pulse 2s infinite;
        }
        @keyframes jakal-live-pulse {
            0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
            70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
        }

        
        /* Action Dropdown for Table */
        .action-dropdown {
            position: relative;
        }
        .action-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            z-index: 10;
        }
        .action-dropdown:hover .action-dropdown-menu {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* HORIZON SPECIFIC NEW STYLES */
        .matrix-grid-bg {
            background-image: radial-gradient(circle, rgba(249, 115, 22, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        .horizon-scanline {
            width: 100%; height: 2px; background: rgba(249, 115, 22, 0.1);
            position: absolute; animation: scan 4s linear infinite; pointer-events: none; z-index: 0;
        }
        .glow-orange { box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
        .node-pulse-horizon {
            animation: pulse-horizon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-horizon {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

    </style>
</head>
<body>
    <div id="background-container"></div>
    <div id="app" class="h-screen flex antialiased relative">
        <!-- Sidebar Navigation --><div id="sidebar" class="sidebar w-64 flex-shrink-0 flex flex-col transition-all duration-300 lg:static fixed z-50">
            <!-- Header --><div id="sidebar-header" class="p-4 flex items-center space-x-2 border-b border-border-color justify-start flex-shrink-0">
                 <button id="sidebar-logo-icon" onclick="window.loadPage('admin_global_dashboard')" class="cursor-pointer focus:outline-none focus:ring-2 focus:ring-cyan-400 rounded-full group flex-shrink-0" aria-label="Go to Dashboard">
                    <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Filter for the white glow -->
                            <filter id="white-glow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="4" result="blur"/>
                                <feFlood flood-color="white" flood-opacity="1" result="color"/>
                                <feComposite in="color" in2="blur" operator="in" result="glow"/>
                                <feMerge>
                                    <feMergeNode in="glow"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                            
                            <!-- Gradient for the red/orange ring -->
                            <linearGradient id="event-horizon-ring" x1="0%" y1="50%" x2="100%" y2="50%">
                                <stop offset="0%" stop-color="#FF8C00"/> <!-- Dark Orange -->
                                <stop offset="50%" stop-color="#FFFFFF"/> <!-- White Hotspot -->
                                <stop offset="100%" stop-color="#FF8C00"/>
                            </linearGradient>
                            
                            <!-- Radial Gradient for "Black Opal" sphere -->
                            <radialGradient id="black-opal-sphere">
                                <stop offset="0%" stop-color="#0F0F0F"/>
                                <stop offset="70%" stop-color="#050505"/>
                                <stop offset="90%" stop-color="#1A1A2A"/> <!-- Hint of dark blue/purple -->
                                <stop offset="100%" stop-color="#000000"/>
                            </radialGradient>
                        </defs>
                        
                        <!-- The white glow element -->
                        <circle cx="50" cy="50" r="30" stroke="white" stroke-width="6" fill="none" filter="url(#white-glow)" opacity="0.8"/>
                        
                        <!-- The red/orange ring -->
                        <circle cx="50" cy="50" r="30" stroke="url(#event-horizon-ring)" stroke-width="4" fill="none">
                            <animateTransform 
                                attributeName="transform"
                                attributeType="XML"
                                type="rotate"
                                from="0 50 50"
                                to="360 50 50"
                                dur="10s"
                                repeatCount="indefinite"/>
                        </circle>
                        
                        <!-- The black hole sphere -->
                        <circle cx="50" cy="50" r="26" fill="url(#black-opal-sphere)"/>
                    </svg>
                 </button>
                 <div class="overflow-hidden">
                    <span id="system-title" class="text-xl font-bold text-primary-color tracking-wider whitespace-nowrap">JAKAL</span>
                    <span id="view-title" class="text-xs text-gray-400 block whitespace-nowrap">Admin</span>
                 </div>
            </div>

            <!-- Nav Links -->
            <nav id="app-nav" class="flex flex-col p-2 space-y-0 flex-1 scrollbar-style overflow-y-auto">
                <!-- Navigation links are dynamically injected here -->
            </nav>
            
            <!-- Sidebar Toggle (Desktop) -->
            <div id="sidebar-toggle-desktop" class="p-4 border-t border-border-color flex-shrink-0 hidden lg:flex">
                <button onclick="window.toggleDesktopSidebar()" class="p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded-lg">
                    <i id="sidebar-toggle-icon" data-lucide="chevron-left-circle" class="w-6 h-6 transition-transform duration-300"></i>
                </button>
            </div>
        </div>
        
        <!-- Main Content Area --><div class="main-content flex flex-col flex-1 overflow-hidden">
            <!-- Header --><header class="h-16 flex items-center justify-between p-4 border-b border-border-color flex-shrink-0">
                <button id="sidebar-toggle-mobile" class="lg:hidden text-white focus:outline-none">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="lg:block">
                    <h1 id="header-title" class="text-xl font-semibold text-white">Q'MDYM Automation System</h1>
                </div>
                
                <!-- View Switch & User Info --><div class="flex items-center space-x-4">
                    <div class="p-1 rounded-lg bg-gray-700/50 flex space-x-1">
                        <button id="switch-admin" onclick="window.setView('admin')" class="px-3 py-1 text-xs font-semibold rounded-md bg-primary-color text-white transition-colors">Admin Console</button>
                        <button id="switch-client" onclick="window.setView('client')" class="px-3 py-1 text-xs font-semibold rounded-md text-gray-400 hover:bg-gray-600 transition-colors">Client Portal</button>
                    </div>

                    <div class="relative">
                        <i data-lucide="bell" class="w-6 h-6 text-gray-400 hover:text-white cursor-pointer"></i>
                        <span class="absolute top-0 right-0 block h-2 w-2 rounded-full ring-2 ring-mid-bg-opaque bg-red-500"></span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <img src="https://placehold.co/32x32/f97316/111827?text=OP" class="w-8 h-8 rounded-full border-2 border-primary-color" onerror="this.onerror=null;this.src='https://placehold.co/32x32/f97316/111827?text=U'">
                        <span id="operator-name" class="text-sm font-medium hidden sm:inline">Operator Alpha</span>
                    </div>
                </div>
            </header>

            <!-- Page Content --><main id="content-area" class="flex-1 overflow-y-auto scrollbar-style p-4 lg:p-6 pb-10">
                <!-- Content will be injected here --></main>

        /**
         * Calls this platform's own configured LLM (Claude or Ollama, whichever

         *
         * Previously this called Google's Gemini API directly from the browser

         * be populated by the environment" -- boilerplate left over from an
         * AI Studio-style prototype scaffold, never adapted to this app's

         * @returns {Promise<{text: string, json: object|null}>}
         */
        async function callJakalLLM(systemPrompt, userPrompt, jsonSchema = null) {
            const response = await fetch('/api/assistant/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_prompt: systemPrompt,
                    user_prompt: userPrompt,
                    json_schema: jsonSchema,
                }),
            });
            if (!response.ok) {
                throw new Error(`Assistant API error: ${response.status} ${response.statusText}`);
            }
            const result = await response.json();
            if (!result.ok) {
                // Honest failure from the backend (no LLM configured, engine
                // unreachable) -- surfaced to the operator, not swallowed.
                throw new Error(result.error || 'LLM generation failed');
            }
            return { text: result.text, json: result.json ?? null };
        }

        async function startLiveExecutionTab() {
            const scriptSel = document.getElementById('live-exec-script');
            try {
                const r = await api('/api/automation/scripts');
                automationState.scripts = r.scripts || [];
                scriptSel.innerHTML = automationState.scripts.length
                    ? automationState.scripts.map(s => `<option value="${s.id}">${escapeHtml(s.name)} (${escapeHtml(s.os)}/${escapeHtml(s.lang)})</option>`).join('')

            } catch (e) {
                scriptSel.innerHTML = `<option disabled>Failed to load: ${escapeHtml(e.message)}</option>`;
            }
            try {
                const r = await api('/api/agents');
                automationState.agents = r.agents || [];

                automationState.agents = [];

            renderLiveExecEndpoints('all');

        window.runLiveExecution = async () => {
            const scriptSel = document.getElementById('live-exec-script');
            const scriptId = scriptSel.value;
            const targets = Array.from(document.querySelectorAll('.live-exec-target-cb:checked')).map(cb => cb.value);
            const outputEl = document.getElementById('live-exec-output');
            const statusEl = document.getElementById('live-exec-status');
            const badgeEl = document.getElementById('live-exec-ws-badge');
            if (!scriptId) { window.showAppModal('Error', 'Select a script first.'); return; }
            if (!targets.length) { window.showAppModal('Error', 'Select at least one endpoint.'); return; }

            const script = automationState.scripts.find(s => s.id === scriptId);
            outputEl.innerHTML = `<p class="text-gray-500">Queuing ${escapeHtml(script ? script.name : scriptId)} on ${targets.length} target(s)…</p>`;

            try {
                const r = await api('/api/exec/run', {
                    method: 'POST',
                    body: JSON.stringify({ script_id: scriptId, target_endpoint_ids: targets, operator: 'operator' }),
                });
                statusEl.textContent = `execution ${r.execution_id}`;
                outputEl.innerHTML = `<p class="text-gray-500">Queued as ${escapeHtml(r.execution_id)}. Waiting for agent output…</p>`;
                window.connectLiveExecWs(r.execution_id, badgeEl, outputEl);
            } catch (e) {
                outputEl.innerHTML += `<p class="text-red-400">Failed to queue: ${escapeHtml(e.message)}</p>`;
            }
        };

        window.connectLiveExecWs = (executionId, badgeEl, outputEl) => {
            if (automationState.ws) { try { automationState.ws.close(); } catch (e) {} }
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${window.location.host}/ws/exec/${executionId}`);
            automationState.ws = ws;
            badgeEl.textContent = 'connecting'; badgeEl.className = 'text-xs px-2 py-0.5 rounded-full bg-yellow-700 text-yellow-200';
            ws.onopen = () => { badgeEl.textContent = 'live'; badgeEl.className = 'text-xs px-2 py-0.5 rounded-full bg-emerald-700 text-emerald-200'; };
            ws.onclose = () => { badgeEl.textContent = 'closed'; badgeEl.className = 'text-xs px-2 py-0.5 rounded-full bg-gray-700 text-gray-400'; };
            ws.onerror = () => { badgeEl.textContent = 'error'; badgeEl.className = 'text-xs px-2 py-0.5 rounded-full bg-red-700 text-red-200'; };
            ws.onmessage = (ev) => {
                let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
                if (msg.type === 'REPLAY_DONE') return;
                if (msg.type === 'AGENT_STREAM_DATA') {
                    if (msg.data) {
                        const isErr = msg.streamType === 'stderr' || msg.streamType === 'powershell_error';
                        const row = document.createElement('div');
                        row.className = isErr ? 'text-red-400' : 'text-gray-200';
                        row.textContent = `[${escapeHtml(msg.endpointId)}] ${msg.data}`;
                        outputEl.appendChild(row);
                        outputEl.scrollTop = outputEl.scrollHeight;
                    }
                    if (msg.done) {
                        const row = document.createElement('p');
                        row.className = 'text-emerald-400 mt-2';
                        row.textContent = `[${escapeHtml(msg.endpointId)}] execution finished.`;
                        outputEl.appendChild(row);
                        outputEl.scrollTop = outputEl.scrollHeight;
                    }
                }
            };

        window.filterScriptLibrary = () => {
            const q = (document.getElementById('script-search')?.value || '').toLowerCase();
            const cat = document.getElementById('script-cat-filter')?.value || 'all';
            const os = document.getElementById('script-os-filter')?.value || 'all';
            const all = window._scriptLibraryAllScripts;
            const filtered = all.filter(s => {
                if (cat !== 'all' && s.category !== cat) return false;
                if (os !== 'all' && s.os !== os && s.os !== 'cross') return false;
                if (q) {
                    const hay = [s.name, s.description, s.category, ...(s.tags||[]), s.lang, s.os].join(' ').toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
            const el = document.getElementById('script-library-list');
            const stats = document.getElementById('script-library-stats');

                    modules[changedIndex].value = newValue;

                    modules.forEach((mod, i) => {

                    if (remainder !== 0) {

                       if(nonZeroIndex !== -1) modules[nonZeroIndex].value += remainder;
                       else modules[changedIndex === 0 ? 1 : 0].value += remainder; // Failsafe
                    }
                    
                    sliders.forEach((s, i) => {

        // --- Map init: real landmass, graticule, pan/zoom, layer toggles ---
        async function _gpmInitMap() {
            const svg = document.getElementById('gpm-map-svg');

            // Graticule (drawn once; every 30 deg lon/lat on the same 1000x500 equirectangular grid the landmass path uses)
            const graticule = document.getElementById('gpm-graticule');
            if (graticule && !graticule.dataset.built) {
                let g = '';
                for (let lon = -180; lon <= 180; lon += 30) {
                    const x = (lon + 180) * (1000 / 360);
                    g += `<line x1="${x}" y1="0" x2="${x}" y2="500"></line>`;
                }
                for (let lat = -60; lat <= 60; lat += 30) {
                    const y = (90 - lat) * (500 / 180);
                    g += `<line x1="0" y1="${y}" x2="1000" y2="${y}"></line>`;
                }
                graticule.innerHTML = g;
                graticule.dataset.built = '1';
            }

            // Landmass (fetched once, cached across page revisits this session)
            const landPath = document.getElementById('gpm-landmass');
            if (landPath && !landPath.getAttribute('d')) {
                try {
                    if (!_gpmWorldPath) {
                        const res = await fetch('/world_land_map.json');
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();
                        _gpmWorldPath = data.path;
                    }
                    landPath.setAttribute('d', _gpmWorldPath);
                } catch (e) {
                    console.warn('Global Predictive Matrix: world map data unavailable, showing grid only.', e);
                }
            }

            // Origin + target pins (static, pulsing)
            const originsG = document.getElementById('gpm-origin-pins');

                originsG.innerHTML = Object.entries(threatOrigins).map(([key, o]) => `

                        <circle cx="${o.x}" cy="${o.y}" r="10" fill="#f97316" fill-opacity="0.15">
                            <animate attributeName="r" values="6;16;6" dur="3s" repeatCount="indefinite"></animate>
                            <animate attributeName="fill-opacity" values="0.35;0;0.35" dur="3s" repeatCount="indefinite"></animate>
                        </circle>
                        <circle cx="${o.x}" cy="${o.y}" r="3.5" fill="#f97316" filter="url(#gpm-glow)"></circle>
                        <text x="${o.x}" y="${o.y - 12}" text-anchor="middle" fill="#cbd5e1" font-size="10" style="paint-order:stroke;stroke:#060a14;stroke-width:3px">${o.name}</text>
                    </g>
                `).join('');
                originsG.dataset.built = '1';

            const targetG = document.getElementById('gpm-target-pin');

            // Layer toggles

                    const layer = cb.dataset.gpmLayer;
                    const targets = { origins: '#gpm-origin-pins', arcs: '#gpm-arcs', grid: '#gpm-graticule' };
                    const el = document.querySelector(targets[layer]);
                    if (el) el.style.display = cb.checked ? '' : 'none';
                };
            });

            // Pan/zoom via viewBox manipulation (no extra dependency)
            if (!svg.dataset.zoomBound) {
                let vb = { x: 0, y: 0, w: 1000, h: 500 };
                const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
                const zoomAt = (factor) => {
                    const newW = Math.max(150, Math.min(1000, vb.w * factor));
                    const newH = newW * (500 / 1000);
                    vb.x += (vb.w - newW) / 2;
                    vb.y += (vb.h - newH) / 2;
                    vb.w = newW; vb.h = newH;
                    apply();
                };
                svg.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    zoomAt(e.deltaY > 0 ? 1.15 : 0.87);
                }, { passive: false });
                document.getElementById('gpm-zoom-in')?.addEventListener('click', () => zoomAt(0.8));
                document.getElementById('gpm-zoom-out')?.addEventListener('click', () => zoomAt(1.25));
                document.getElementById('gpm-zoom-reset')?.addEventListener('click', () => { vb = { x: 0, y: 0, w: 1000, h: 500 }; apply(); });

                let dragging = false, lastX = 0, lastY = 0;
                svg.addEventListener('mousedown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
                window.addEventListener('mouseup', () => { dragging = false; });
                svg.addEventListener('mousemove', (e) => {
                    if (!dragging) return;
                    const scale = vb.w / svg.clientWidth;
                    vb.x -= (e.clientX - lastX) * scale;
                    vb.y -= (e.clientY - lastY) * scale;
                    lastX = e.clientX; lastY = e.clientY;
                    apply();
                });
                svg.dataset.zoomBound = '1';
            }
        }

        function setupInteractiveGlobe() {
            const container = document.getElementById('globe-container');
            if (!container) return;
            if (!window.THREE) { console.warn('Three.js unavailable (CDN blocked/offline) — skipping 3D globe.'); return; }

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            camera.position.z = 5;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const context = canvas.getContext('2d');
            context.fillStyle = 'rgba(249, 115, 22, 0.2)'; // Horizon Orange
            for (let i = 0; i < 6000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                context.beginPath();
                context.arc(x, y, 1.5, 0, Math.PI * 2);
                context.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);

            const geometry = new THREE.SphereGeometry(2, 64, 64);
            const material = new THREE.MeshPhongMaterial({
                map: texture,
                transparent: true,
                opacity: 0.8,
                shininess: 50,
                specular: 0x888888,
            });
            const globe = new THREE.Mesh(geometry, material);
            globeGroup.add(globe);

            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            const starGeometry = new THREE.BufferGeometry();
            const starVertices = [];
            for (let i = 0; i < 10000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                const dist = Math.sqrt(x*x + y*y + z*z);
                if (dist > 100) {
                     starVertices.push(x, y, z);
                }
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0x888888, size: 0.7 });
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            let isMouseDown = false;
            let previousMousePosition = { x: 0, y: 0 };
            container.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                previousMousePosition.x = e.clientX;
                previousMousePosition.y = e.clientY;
                container.classList.add('grabbing');
            });
            container.addEventListener('mouseup', () => {
                isMouseDown = false;
                container.classList.remove('grabbing');
            });
             container.addEventListener('mouseleave', () => {
                isMouseDown = false;
                container.classList.remove('grabbing');
            });
            container.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                globeGroup.rotation.y += deltaX * 0.005;
                globeGroup.rotation.x += deltaY * 0.005;
                previousMousePosition.x = e.clientX;
                previousMousePosition.y = e.clientY;
            });

            function animate() {
                animationFrameId = requestAnimationFrame(animate);
                if(globeGroup) globeGroup.rotation.y += 0.0005;
                if(stars) stars.rotation.y += 0.0001;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                const width = container.clientWidth;
                const height = container.clientHeight;
                if(width > 0 && height > 0) {
                     renderer.setSize(width, height);
                     camera.aspect = width / height;
                     camera.updateProjectionMatrix();
                }
            });
        }
        
        function startQuantumComputerModule() {
            const gates = document.querySelectorAll('.quantum-gate');
            const slots = document.querySelectorAll('.gate-slot');
            let draggedItem = null;

            gates.forEach(gate => {
                gate.addEventListener('dragstart', (e) => {
                    draggedItem = e.target;
                    setTimeout(() => e.target.style.display = 'none', 0);
                });
                gate.addEventListener('dragend', (e) => {
                    setTimeout(() => {
                        draggedItem.style.display = 'flex';
                        draggedItem = null;
                    }, 0);
                });
            });

            slots.forEach(slot => {
                slot.addEventListener('dragover', (e) => e.preventDefault());
                slot.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    e.target.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', (e) => {
                    e.target.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    e.target.classList.remove('drag-over');
                    if (draggedItem && e.currentTarget.classList.contains('gate-slot')) {
                        if (e.currentTarget.children.length === 0) {
                             const newGate = draggedItem.cloneNode(true);
                             newGate.style.display = 'flex';
                             newGate.classList.remove('quantum-gate');
                             e.currentTarget.appendChild(newGate);
                        }
                    }
                });
            });
        }

                        </div>`).join('') +
                        `<button onclick="window.loadPage('admin_soar')" class="mt-2 text-xs text-primary-color hover:underline">Manage Playbooks →</button>`;

                    agentEl.innerHTML = `<p class="text-xs text-gray-500">No active playbooks. <button onclick="window.loadPage('admin_soar')" class="text-primary-color hover:underline">Open Canvas</button> to create one.</p>`;
                }
            }

            // SOAR tickets
            const soarData = await fetchSafe('/api/soar/tickets?limit=4');
            const soarEl = document.getElementById('dash-soar-tickets');
            if (soarEl) {
                const tickets = (soarData?.tickets||[]).slice(0,4);
                soarEl.innerHTML = tickets.length ? tickets.map(t => `
                    <div class="flex items-center justify-between py-1">
                        <span class="text-gray-400 truncate">${escapeHtml((t.summary||t.indicator||'').substring(0,40))}</span>

                    </div>`).join('') : '<p class="text-gray-500 italic">No recent tickets.</p>';
            }

            // Compliance drift
            const driftData = await fetchSafe('/api/enterprise/compliance/drift');
            const driftEl = document.getElementById('dash-drift-events');
            if (driftEl) {
                const events = (driftData?.events||[]).slice(0,4);
                driftEl.innerHTML = events.length ? events.map(e => `
                    <div class="flex items-center justify-between py-1">
                        <span class="text-gray-400 truncate">${escapeHtml((e.description||e.type||'').substring(0,40))}</span>
                        <span class="${e.severity==='CRITICAL'?'text-red-400':e.severity==='HIGH'?'text-orange-400':'text-yellow-400'} text-xs ml-2 flex-shrink-0">${escapeHtml(e.severity||'')}</span>
                    </div>`).join('') : '<p class="text-gray-500 italic">No drift events.</p>';
            }

            // Dark web findings
            const dwData = await fetchSafe('/api/darkweb/findings');
            const dwEl = document.getElementById('dash-dw-findings');
            if (dwEl) {
                const findings = (dwData?.findings||[]).slice(0,4);
                dwEl.innerHTML = findings.length ? findings.map(f => `
                    <div class="flex items-center justify-between py-1">
                        <span class="text-gray-400 truncate">${escapeHtml((f.title||f.query||'').substring(0,40))}</span>
                        <span class="text-red-400 text-xs ml-2 flex-shrink-0">${escapeHtml(f.severity||'new')}</span>
                    </div>`).join('') : '<p class="text-emerald-500 text-xs">No active findings.</p>';
            }
        };

        window.switchDashboardTab = (tab, doRender = true) => {
            currentDashboardTab = tab;
            document.querySelectorAll('.dashboard-tab').forEach(t => t.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${tab}`);
            if (activeTab) activeTab.classList.add('active');

            const content = document.getElementById('dashboard-content-area');
            if (!content) return;

            if(tab !== 'matrix') {
                 if (d3Simulations.ucc) d3Simulations.ucc.stop();
                 activeIntervals.forEach(clearInterval);
                 activeIntervals = [];
            }
            if(tab !== 'fleet') {
                activeIntervals.forEach(clearInterval);
                activeIntervals = [];
            }

            if (doRender) {
                if (tab === 'overview') { content.innerHTML = renderDashboardOverviewTab(); safeCreateIcons(); window.loadDashboardOverviewData(); }
                if (tab === 'fleet') content.innerHTML = renderDeviceFleetTab();
                if (tab === 'matrix') content.innerHTML = renderGlobalPredictiveMatrix();
                if (tab === 'settings') content.innerHTML = renderGlobalSettingsTab();
                if (tab !== 'overview') safeCreateIcons();

                if (tab === 'fleet') startGlobalDashboardSimulations();
                if (tab === 'matrix') startGlobalPredictiveMatrixSimulations();
                if (tab === 'settings') window.switchSettingsSubTab(currentSettingsSubTab, false);
            }
        }
        
        // --- ADMIN DASH TAB 1: DEVICE FLEET ---
        
        function renderDeviceFleetTab() {
            return `
                <div class="dashboard-tab-content flex flex-col h-full gap-4">
                    <div id="fleet-summary-banner" class="flex-shrink-0"></div>

                        <div class="label">${label}</div>

                </div>`;
            el.innerHTML = `
                <div class="flex flex-wrap gap-3 items-stretch">

                    ${tile('monitor-x', 'yellow-400', counts.Warning, 'Warning')}
                    ${tile('shield-alert', 'red-400', counts.Critical, 'Critical')}
                    ${tile('server', 'blue-400', devices.length, 'Total Managed')}
                </div>
                <p class="text-xs text-gray-500 mt-2 flex items-center gap-2">${isLive ? '<span class="jakal-live-dot"></span> Live from /api/dashboard/fleet' : 'Demo data — connect a backend and open this tab to sync real devices'}</p>
            `;
            safeCreateIcons();
        }
        // Exposed on window for the same reason globalDashboardState and
        // switchDashboardTab are below: js/jakal-live-data.js is a classic
        // script outside this <script type="module"> block, so it can only
        // call these through window. Without this, window.renderDeviceFleetTable
        // was always undefined, so refreshFleet()'s fallback branch fired
        // instead -- calling switchDashboardTab('fleet'), which (once hooked)
        // re-triggers refreshFleet() 50ms later, forever, hammering
        // /api/dashboard/fleet in a tight loop and flooding the rate limiter.
        window.renderFleetSummaryBanner = renderFleetSummaryBanner;

        window.updateClientFilter = (client) => {
            globalDashboardState.clientFilter = client;
            renderDeviceFleetTable();
        }

        let _fleetViewMode = 'table'; // 'table' | 'grid'
        let _fleetSort = { col: 'name', dir: 'asc' };
        let _fleetSearch = '';
        let _fleetStatusFilter = 'all';

        function renderDeviceFleetTable() {
            renderFleetSummaryBanner();
            const tableEl = document.getElementById('device-list-table');
            if (!tableEl) return;

            // Controls row
            tableEl.innerHTML = `
                <div class="flex flex-col gap-3">
                    <!-- Toolbar -->
                    <div class="flex flex-wrap gap-2 items-center">
                        <input id="fleet-search-input" type="text" placeholder="Search devices, IPs, users…"

                            oninput="_fleetSearch=this.value;renderDeviceFleetTable()"
                            class="flex-1 min-w-0 bg-gray-900 border border-border-color rounded-lg px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-primary-color">
                        <select onchange="_fleetStatusFilter=this.value;renderDeviceFleetTable()"
                            class="bg-gray-900 border border-border-color rounded-lg px-2 py-1.5 text-xs text-gray-200">
                            <option value="all" ${_fleetStatusFilter==='all'?'selected':''}>All Status</option>
                            <option value="Healthy" ${_fleetStatusFilter==='Healthy'?'selected':''}>Healthy</option>
                            <option value="Warning" ${_fleetStatusFilter==='Warning'?'selected':''}>Warning</option>
                            <option value="Critical" ${_fleetStatusFilter==='Critical'?'selected':''}>Critical</option>
                        </select>
                        <div class="flex rounded-lg overflow-hidden border border-border-color">
                            <button onclick="_fleetViewMode='table';renderDeviceFleetTable()" class="px-2 py-1.5 text-xs ${_fleetViewMode==='table'?'bg-primary-color text-white':'bg-gray-900 text-gray-400'} hover:bg-primary-color hover:text-white transition-colors">
                                <i data-lucide="table" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="_fleetViewMode='grid';renderDeviceFleetTable()" class="px-2 py-1.5 text-xs ${_fleetViewMode==='grid'?'bg-primary-color text-white':'bg-gray-900 text-gray-400'} hover:bg-primary-color hover:text-white transition-colors">
                                <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                        <button onclick="window.exportFleetCSV()" class="px-2 py-1.5 bg-gray-800 border border-border-color rounded-lg text-xs text-gray-400 hover:text-white flex items-center gap-1">
                            <i data-lucide="download" class="w-3 h-3"></i>CSV
                        </button>
                        <button onclick="window.bulkFleetAction('scan')" class="px-2 py-1.5 bg-gray-800 border border-border-color rounded-lg text-xs text-gray-400 hover:text-white flex items-center gap-1">
                            <i data-lucide="scan" class="w-3 h-3"></i>Bulk Scan
                        </button>
                    </div>
                    <!-- Table / Grid content -->
                    <div id="fleet-view-content"></div>
                </div>`;

            // Filter + sort
            let devices = globalDashboardState.devices.filter(d => {
                if (globalDashboardState.clientFilter !== 'All' && d.client !== globalDashboardState.clientFilter) return false;
                if (_fleetStatusFilter !== 'all' && d.status !== _fleetStatusFilter) return false;
                if (_fleetSearch) {
                    const hay = [d.name||'', d.hostname||'', d.ip||'', d.user||'', d.os||'', d.client||''].join(' ').toLowerCase();
                    if (!hay.includes(_fleetSearch.toLowerCase())) return false;
                }
                return true;
            });
            devices = devices.sort((a, b) => {
                const av = (a[_fleetSort.col] || '').toString().toLowerCase();
                const bv = (b[_fleetSort.col] || '').toString().toLowerCase();
                return _fleetSort.dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
            });

            const statusDot = s => `<span class="inline-block w-2 h-2 rounded-full mr-1.5 ${s==='Healthy'?'bg-emerald-400':s==='Critical'?'bg-red-400':'bg-yellow-400'}"></span>`;
            const riskBar = (score) => {
                const pct = Math.round((score||0)*100);
                const color = pct > 70 ? 'bg-red-500' : pct > 40 ? 'bg-yellow-500' : 'bg-emerald-500';
                return `<div class="flex items-center gap-1.5"><div class="flex-1 h-1.5 bg-gray-700 rounded-full overflow-hidden"><div class="${color} h-full rounded-full" style="width:${pct}%"></div></div><span class="text-xs text-gray-500">${pct}%</span></div>`;
            };
            const actionMenu = (id, name) => `
                <div class="action-dropdown inline-block">
                    <button class="p-1 text-gray-500 hover:text-white rounded"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
                    <div class="action-dropdown-menu card rounded-lg shadow-xl w-36 text-left z-50">
                        <a href="#" onclick="window.selectDevice('${id}');return false" class="block px-3 py-2 text-xs hover:bg-gray-700"><i data-lucide="info" class="w-3 h-3 inline mr-1"></i>Details</a>
                        <a href="#" onclick="window.deviceAction('scan','${id}');return false" class="block px-3 py-2 text-xs hover:bg-gray-700"><i data-lucide="search" class="w-3 h-3 inline mr-1"></i>Scan</a>
                        <a href="#" onclick="window.deviceAction('patch','${id}');return false" class="block px-3 py-2 text-xs hover:bg-gray-700"><i data-lucide="download" class="w-3 h-3 inline mr-1"></i>Patch</a>
                        <a href="#" onclick="window.deviceAction('isolate','${id}');return false" class="block px-3 py-2 text-xs hover:bg-gray-700 text-yellow-400"><i data-lucide="wifi-off" class="w-3 h-3 inline mr-1"></i>Isolate</a>
                        <a href="#" onclick="window.deviceAction('reset_pass','${id}');return false" class="block px-3 py-2 text-xs hover:bg-gray-700"><i data-lucide="key" class="w-3 h-3 inline mr-1"></i>Reset Pass</a>
                        <a href="#" onclick="window.deviceAction('quarantine','${id}');return false" class="block px-3 py-2 text-xs hover:bg-gray-700 text-red-400"><i data-lucide="shield-x" class="w-3 h-3 inline mr-1"></i>Quarantine</a>
                        <a href="#" onclick="window.generateDeviceReport('${id}');return false" class="block px-3 py-2 text-xs hover:bg-gray-700 text-primary-color"><i data-lucide="file-text" class="w-3 h-3 inline mr-1"></i>CPENT Report</a>
                    </div>
                </div>`;

            const content = document.getElementById('fleet-view-content');
            if (!content) { safeCreateIcons(); return; }

            if (_fleetViewMode === 'grid') {
                const statusStyles = {
                    'Healthy': { text: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/30' },
                    'Warning': { text: 'text-yellow-400', bg: 'bg-yellow-500/10', border: 'border-yellow-500/30' },
                    'Critical': { text: 'text-red-400', bg: 'bg-red-500/10', border: 'border-red-500/30' },
                };
                content.innerHTML = `<div class="grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-3">
                    ${devices.map(dev => {
                        const s = statusStyles[dev.status] || { text:'text-gray-400', bg:'bg-gray-700/10', border:'border-gray-700' };
                        return `<div class="jakal-device-card ${s.bg} border ${s.border} cursor-pointer" onclick="window.selectDevice('${dev.id}')">

                                <div><p class="device-name">${escapeHtml(dev.name)}</p><p class="device-meta">${escapeHtml(dev.client||'')}</p></div>

                                <div class="flex justify-between"><span class="text-gray-500">IP</span><span class="font-mono text-gray-300">${escapeHtml(dev.ip||'—')}</span></div>
                                <div class="mt-2"><span class="text-gray-500 block mb-1">Risk</span>${riskBar(dev.risk_score)}</div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
            } else {
                // Advanced Table view
                const sortArrow = (col) => _fleetSort.col === col ? (_fleetSort.dir === 'asc' ? '↑' : '↓') : '<span class="text-gray-700">↕</span>';
                const th = (col, label, extra='') => `<th class="px-3 py-2.5 text-left text-xs font-semibold text-gray-400 cursor-pointer hover:text-white select-none ${extra}" onclick="window.sortFleet('${col}')">${label} ${sortArrow(col)}</th>`;
                content.innerHTML = `
                    <div class="overflow-x-auto rounded-xl border border-border-color">

                                ${th('status','Status','w-24')}

                                ${th('ip','IP Address','font-mono')}
                                ${th('os','OS')}
                                ${th('client','Client')}
                                <th class="px-3 py-2.5 text-left text-xs font-semibold text-gray-400 w-28">Risk Score</th>
                                ${th('login','Last Seen')}

                            </tr></thead>
                            <tbody id="fleet-table-body">
                                ${devices.map((dev, idx) => `
                                <tr class="border-b border-gray-800/60 hover:bg-gray-800/40 transition-colors cursor-pointer ${idx%2===0?'':'bg-gray-900/20'}"

                                        <input type="checkbox" class="fleet-row-cb rounded" value="${dev.id}">

                                    <td class="px-3 py-2.5">
                                        <span class="flex items-center gap-1 font-semibold ${dev.status==='Healthy'?'text-emerald-400':dev.status==='Critical'?'text-red-400':'text-yellow-400'}">
                                            ${statusDot(dev.status)}${escapeHtml(dev.status||'—')}
                                        </span>
                                    </td>
                                    <td class="px-3 py-2.5">
                                        <div class="font-semibold text-white">${escapeHtml(dev.name||dev.hostname||'—')}</div>

                            </tbody>
                        </table>
                    </div>

            }
            safeCreateIcons();
        }
        // See the window.renderFleetSummaryBanner note above -- same reason.
        window.renderDeviceFleetTable = renderDeviceFleetTable;

        window.sortFleet = (col) => {
            if (_fleetSort.col === col) _fleetSort.dir = _fleetSort.dir === 'asc' ? 'desc' : 'asc';
            else { _fleetSort.col = col; _fleetSort.dir = 'asc'; }

        };

        window.fleetSelectAll = (checked) => {
            document.querySelectorAll('.fleet-row-cb').forEach(cb => cb.checked = checked);

        window.bulkFleetAction = async (action) => {
            const selected = Array.from(document.querySelectorAll('.fleet-row-cb:checked')).map(cb => cb.value);
            if (!selected.length) { window.showAppModal('Bulk Action', 'Select at least one device (check the row checkbox).'); return; }
            if (action === 'scan') {

        function startGlobalDashboardSimulations() {
            renderDeviceFleetTable();
            const interval = setInterval(() => {
                // js/jakal-live-data.js has synced real devices from
                // /api/dashboard/fleet -- this loop's randomized status
                // flips exist only to make the demo/offline view feel
                // alive, and must never mutate genuine fleet data.
                // __jkFleetLive (not __jkFleetSynced, which just means a
                // sync was *attempted*) is set only once real data has
                // actually replaced the mock array.
                if (window.__jkFleetLive) return;
                const randomDevice = globalDashboardState.devices[Math.floor(Math.random() * globalDashboardState.devices.length)];
                const oldStatus = randomDevice.status;
                
                if (randomDevice.status === 'Healthy') {
                    if (Math.random() > 0.9) randomDevice.status = 'Warning';
                } else if (randomDevice.status === 'Warning') {
                    if (Math.random() > 0.8) randomDevice.status = 'Critical';
                    else if (Math.random() > 0.5) randomDevice.status = 'Healthy';
                } else {
                     if (Math.random() > 0.3) randomDevice.status = 'Healthy';
                }
                
                if (oldStatus !== randomDevice.status) {
                    renderDeviceFleetTable(); 
                    if(globalDashboardState.selectedDeviceId === randomDevice.id) {
                        const logEl = document.getElementById('device-log-feed');
                        if(logEl) {
                            logEl.innerHTML += generateLogEntry(`Device status changed from ${oldStatus} to ${randomDevice.status}`, 'yellow-400', 'lucide-alert-triangle');
                            logEl.scrollTop = logEl.scrollHeight;
                            safeCreateIcons();
                        }
                    }
                }
            }, 8000);
            activeIntervals.push(interval);
        }

        window.startPenTestSimulation = function() {
            const resultsDiv = document.getElementById('pen-test-results');
            const insightsDiv = document.getElementById('pen-test-insights');
            const logDiv = document.getElementById('pen-test-log');
            const optimizerBtn = document.getElementById('execution-optimizer-btn-pentest');
            const attemptsPill = document.getElementById('pentest-attempts');
            const vulnsPill = document.getElementById('pentest-vulns');
            const depthPill = document.getElementById('pentest-depth');
            const intensity = document.getElementById('test-intensity-sim').value;
            const btn = document.getElementById('pen-test-btn');

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 mr-2 animate-spin"></i> Simulation Running...';
            safeCreateIcons();
            
            resultsDiv.classList.remove('hidden');
            insightsDiv.innerHTML = `<p class="text-yellow-400">Simulation running... identifying vulnerabilities...</p>`;
            logDiv.innerHTML = generateLogEntry('Simulation started.', 'primary-color');
            optimizerBtn.disabled = true;
            optimizerBtn.classList.add('bg-green-800/50', 'text-green-400', 'cursor-not-allowed');
            optimizerBtn.classList.remove('bg-green-600', 'text-white', 'cursor-pointer');

            let iteration = 0;
            let totalVulns = 0;

            const runIteration = () => {
                if (iteration >= parseInt(intensity)) {
                    insightsDiv.innerHTML = `<p><strong>Assessment:</strong> Found ${totalVulns} vulnerabilities. <br> <strong>Resolution:</strong> Autonomous patch deployment via Execution Optimizer is recommended.</p>`;
                    logDiv.innerHTML += generateLogEntry('Simulation complete.', 'primary-color');
                    if (totalVulns > 0) {
                        optimizerBtn.disabled = false;
                        optimizerBtn.classList.remove('bg-green-800/50', 'text-green-400', 'cursor-not-allowed');
                        optimizerBtn.classList.add('bg-green-600', 'text-white', 'cursor-pointer');
                    }
                    btn.disabled = false;
                    btn.textContent = 'Start Ethical Penetration Test Simulation';
                    return;
                }
                
                iteration++;
                const foundVuln = Math.random() > 0.7; 
                if (foundVuln) {
                    totalVulns++;
                    logDiv.innerHTML += generateLogEntry(`Vulnerability found: 'SQL Injection on login endpoint'.`, 'red-500');
                } else {
                    logDiv.innerHTML += generateLogEntry(`Attempt ${iteration}: No new vulnerabilities found.`, 'gray-400');
                }
                logDiv.scrollTop = logDiv.scrollHeight;

                if(attemptsPill) attemptsPill.querySelector('span:last-child').textContent = iteration;
                if(vulnsPill) vulnsPill.querySelector('span:last-child').textContent = totalVulns;
                if(depthPill) depthPill.querySelector('span:last-child').textContent = `${Math.round((iteration / parseInt(intensity)) * 100)}%`;

                setTimeout(runIteration, 200); 
            };
            runIteration();
        }

        function startOntologySimulation() {
            const container = document.getElementById('ontology-graph-container');
            if(!container) return;
            if (!window.d3) { console.warn('D3 unavailable (CDN blocked/offline) — skipping ontology graph.'); return; }

            const width = container.clientWidth;
            const height = container.clientHeight;
            const svg = d3.select(container);
            const tooltip = d3.select('#ontology-tooltip');

            const nodes = [
                { id: "User: j.doe", group: 1, icon: "user", details: "User in Finance Dept." }, 
                { id: "Device: FIN-LT-04", group: 1, icon: "laptop", details: "OS: Windows 11" },
                { id: "Server: DEV-SRV-01", group: 2, icon: "server", details: "OS: Ubuntu 22.04" }, 
                { id: "Database: AuthDB", group: 2, icon: "database", details: "Contains user credentials." },
                { id: "Threat: Malware-XYZ", group: 3, icon: "shield-alert", details: "Type: Ransomware" }, 
                { id: "IP: 1.2.3.4", group: 3, icon: "globe", details: "Known C2 Server" }
            ];
            const links = [
                { source: "User: j.doe", target: "Device: FIN-LT-04", value: 2 },
                { source: "Device: FIN-LT-04", target: "Server: DEV-SRV-01", value: 2 },
                { source: "Server: DEV-SRV-01", target: "Database: AuthDB", value: 2 },
                { source: "Threat: Malware-XYZ", target: "Device: FIN-LT-04", value: 5 },
                { source: "Threat: Malware-XYZ", target: "IP: 1.2.3.4", value: 5 }
            ];
            
            d3Simulations.ontology = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-200))
                .force("center", d3.forceCenter(width / 2, height / 2));

            const link = svg.append("g").selectAll("line")
                .data(links).enter().append("line")
                .attr("class", "link")
                .attr("stroke", "var(--border-color)")
                .attr("stroke-width", d => Math.sqrt(d.value));

            const node = svg.append("g").selectAll("g")
                .data(nodes).enter().append("g").attr("class", "node")
                .call(d3.drag()
                    .on("start", (event, d) => {
                        if (!event.active) d3Simulations.ontology.alphaTarget(0.3).restart();
                        d.fx = d.x; d.fy = d.y;
                    })
                    .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
                    .on("end", (event, d) => {
                        if (!event.active) d3Simulations.ontology.alphaTarget(0);
                        d.fx = null; d.fy = null;
                    })
                )
                .on("mouseover", (event, d) => {
                    tooltip.transition().duration(200).style("opacity", .9);
                    tooltip.html(`<strong>${d.id}</strong><br>${d.details}`)
                        .style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY - 28) + "px");
                    document.getElementById('ontology-node-details').innerHTML = `<p class="font-bold text-white">${d.id}</p><p>${d.details}</p>`;
                })
                .on("mouseout", () => {
                    tooltip.transition().duration(500).style("opacity", 0);
                });
            
            node.append("circle")
                .attr("r", 15)
                .attr("fill", d => d.group === 1 ? '#60a5fa' : d.group === 2 ? '#34d399' : '#f87171');

            node.append("foreignObject")
                 .attr("width", 20).attr("height", 20)
                 .attr("x", -10).attr("y", -10)
                 .html(d => `<i data-lucide="${d.icon}" class="w-5 h-5 text-white"></i>`);
            
            d3Simulations.ontology.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
            safeCreateIcons();
        }

        window.runAipInvestigator = async () => {
            const nodeLayer = document.getElementById('investigation-node-layer');
            const notesEl = document.getElementById('case-notes');
            if(!nodeLayer || !notesEl) return;
            
            notesEl.innerHTML += generateLogEntry('✨ AIP Investigator running...', 'purple-400', 'lucide-sparkles');
            safeCreateIcons();
            notesEl.scrollTop = notesEl.scrollHeight;

            const evidence = Array.from(document.querySelectorAll('.investigation-node'))
                                .map(node => node.textContent.trim().replace(/\s+/g, ' '))
                                .join('; ');
            
            const systemPrompt = "You are an elite AI cybersecurity investigator, part of the 'Horizon' system. You analyze scattered evidence from an ongoing investigation. Your response must be concise, actionable, and formatted as a JSON object with 'analysis' (a short string) and 'nextSteps' (an array of 3 brief strings).";
            const userQuery = `Analyze the following evidence: "${evidence}". Provide a brief analysis and 3 recommended next investigation steps.`;

            // Standard JSON Schema (lowercase types), not Gemini's
            // proprietary uppercase dialect -- passed through to whichever
            // backend is configured (Claude/Ollama via services/llm_client.py)
            // as a plain formatting hint in the prompt.
            const schema = {
                type: "object",
                properties: {
                    analysis: { type: "string" },
                    nextSteps: {
                        type: "array",
                        items: { type: "string" }
                    }
                },
                required: ["analysis", "nextSteps"]
            };

            try {
                const { json } = await callJakalLLM(systemPrompt, userQuery, schema);
                if (!json) {
                    throw new Error("Model did not return valid JSON for the schema requested.");
                }

                notesEl.innerHTML += generateLogEntry(`AIP Analysis: ${json.analysis}`, 'purple-400', 'lucide-brain');
                safeCreateIcons();

                json.nextSteps.forEach((step, index) => {
                    const x = 60 + (index * 5);
                    const y = 30 + (index * 20);
                    addNewInvestigationNode(step, `${x}%`, `${y}%`);
                });

            } catch (error) {
                 console.error("AIP Investigator failed:", error);
                 notesEl.innerHTML += generateLogEntry(`AIP Investigator failed: ${error.message}`, 'red-500', 'lucide-x-circle');

        window.filterCheatsheets = function() {

            const type = document.getElementById('cs-type-filter')?.value || 'all';

                ..._csData.tools.map(e => ({...e, _type:'tool'}))

            const filtered = all.filter(e => {
                if (type !== 'all' && e._type !== type) return false;
                if (cat !== 'all' && e.category !== cat) return false;
                if (q) {
                    const hay = (e.title + ' ' + e.content).toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;

            const grid = document.getElementById('cs-grid');

            stats.textContent = filtered.length + ' of ' + all.length + ' entries';

                        </select>
