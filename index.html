        function _cvssColor(score) {
            if (score >= 9) return 'red-500';
            if (score >= 7) return 'orange-500';
            if (score >= 4) return 'yellow-500';
            return 'blue-400';
        }

        window.loadVulnCves = async () => {
            const listEl = document.getElementById('vulnman-cve-list');
            if (!listEl) return;
            try {
                const r = await api('/api/vulnerabilities/cves?limit=200');
                const vulns = r.vulnerabilities || [];
                const counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
                vulns.forEach(v => { if (counts[v.severity] !== undefined) counts[v.severity]++; });
                const setPill = (id, val) => { const e = document.getElementById(id); if (e) e.querySelector('span:last-child').textContent = val; };
                setPill('vulnman-pill-critical', counts.CRITICAL);
                setPill('vulnman-pill-high', counts.HIGH);
                setPill('vulnman-pill-medium', counts.MEDIUM);
                setPill('vulnman-pill-low', counts.LOW);
                setPill('vulnman-pill-total', vulns.length);

                if (!vulns.length) {
                    listEl.innerHTML = '<p class="text-gray-500 italic">No CVEs recorded yet — run a scan above.</p>';
                    return;
                }
                listEl.innerHTML = vulns.map(v => `
                    <div class="p-3 bg-gray-900 rounded-lg mb-2 flex items-start justify-between">
                        <div>
                            <p class="font-mono text-white text-xs">${escapeHtml(v.vuln_id)}</p>
                            <p class="text-gray-400 text-xs mt-1">${escapeHtml((v.description || '').slice(0, 160))}</p>
                        </div>
                        <span class="text-${_cvssColor(v.cvss_score || 0)} font-bold text-sm ml-3 flex-shrink-0">${v.cvss_score != null ? v.cvss_score.toFixed(1) : '—'}</span>
                    </div>
                `).join('');
            } catch (e) {
                listEl.innerHTML = `<p class="text-red-400">Failed to load CVEs: ${escapeHtml(e.message)}</p>`;
            }
        };

        window.loadVulnDevices = async () => {
            const sel = document.getElementById('vulnman-device-select');
            if (!sel) return;
            try {
                const r = await api('/api/fleet/devices?limit=200');
                const devices = r.devices || [];
                sel.innerHTML = devices.length
                    ? devices.map(d => `<option value="${d.device_id}">${escapeHtml(d.hostname || d.ip_address || d.device_id)} — ${escapeHtml(d.os_fingerprint || 'unknown OS')}</option>`).join('')
                    : '<option disabled>No devices discovered yet</option>';
            } catch (e) {
                sel.innerHTML = `<option disabled>Failed to load devices: ${escapeHtml(e.message)}</option>`;
            }
        };

        window.startVulnScan = async () => {
            const sel = document.getElementById('vulnman-device-select');
            const ids = Array.from(sel.selectedOptions).map(o => o.value);
            const btn = document.getElementById('vulnman-scan-btn');
            const progressEl = document.getElementById('vulnman-scan-progress');
            if (!ids.length) { window.showAppModal('Error', 'Select at least one device to scan.'); return; }

            btn.disabled = true;
            progressEl.classList.remove('hidden');
            progressEl.innerHTML = '<p class="text-gray-400 text-sm">Deriving scan targets…</p>';

            try {
                const start = await api('/api/vulnerabilities/scan/immediate', {
                    method: 'POST', body: JSON.stringify({ device_ids: ids }),
                });
                const scanId = start.scan_id;
                progressEl.innerHTML = `<p class="text-gray-400 text-sm mb-2">Scanning ${start.targets_total} target(s): ${start.targets.map(t => escapeHtml(t.name + ' ' + t.version)).join(', ')}</p><div class="w-full bg-gray-800 rounded-full h-3"><div id="vulnman-progress-bar" class="bg-primary-color h-3 rounded-full transition-all" style="width:0%"></div></div><p id="vulnman-progress-text" class="text-xs text-gray-500 mt-1">0%</p>`;

                const poll = async () => {
                    const p = await api(`/api/vulnerabilities/scan/${scanId}/progress`);
                    const bar = document.getElementById('vulnman-progress-bar');
                    const text = document.getElementById('vulnman-progress-text');
                    if (bar) bar.style.width = `${p.progress_percentage}%`;
                    if (text) text.textContent = `${p.progress_percentage}% — ${p.findings_so_far} finding(s) so far (${p.critical} critical, ${p.high} high)`;
                    if (p.status === 'completed' || p.status === 'failed') {
                        if (p.status === 'failed') progressEl.innerHTML += `<p class="text-red-400 text-sm mt-2">Scan failed: ${escapeHtml(p.error || 'unknown error')}</p>`;
                        else progressEl.innerHTML += `<p class="text-emerald-400 text-sm mt-2">Scan complete.</p>`;
                        window.loadVulnCves();
                        return;
                    }
                    setTimeout(poll, 2000);
                };
                poll();
            } catch (e) {
                progressEl.innerHTML = `<p class="text-red-400">Scan failed to start: ${escapeHtml(e.message)}</p>`;
            } finally {
                btn.disabled = false;
            }
        };

        // ── PAM / Compliance / KMS real handlers ─────────────────────────────────

        window.pamAction = async (decision) => {
            // PAM approve/deny — routes through the approval gate endpoint
            const label = decision === 'approve' ? 'APPROVED' : 'DENIED';
            try {
                // Try to find a pending approval; if none, show explicit guidance
                const r = await api('/api/approval/pending');
                const pending = (r.pending || []);
                if (!pending.length) {
                    window.showAppModal('PAM', `<p>No pending privileged-access requests in the approval queue right now.</p><p class="text-xs text-gray-400 mt-2">PAM actions are queued when an isolate, quarantine, or high-risk script runs without pre-approval. Check the Approval Gate module.</p>`);
                    return;
                }
                const req = pending[0];
                const endpoint = decision === 'approve' ? `/api/approval/${req.id}/approve` : `/api/approval/${req.id}/deny`;
                await api(endpoint, { method: 'POST', body: JSON.stringify({ reason: 'PAM dashboard decision' }) });
                window.showAppModal('PAM Decision', `<p>Access request <strong>${escapeHtml(req.id || String(req.id))}</strong> has been <strong class="${decision==='approve'?'text-emerald-400':'text-red-400'}">${label}</strong>.</p>`);
            } catch(e) {
                window.showAppModal('PAM', `<p>Approval gate response: ${escapeHtml(e.message)}</p><p class="text-xs text-gray-400 mt-2">If this is expected, check the Approval Gate module directly.</p>`);

        };

                window.showAppModal('Compliance Scan Complete', `
                    <p class="mb-3">Live posture check completed across ${frameworks.length} framework(s).</p>
                    <div class="space-y-2">${frameworks.map(k => {
                        const v = r[k]; const pct = typeof v === 'number' ? Math.round(v*100) : null;
                        return `<div class="flex justify-between text-sm"><span class="text-gray-300 uppercase text-xs">${escapeHtml(k.replace(/_/g,' '))}</span><span class="${pct!=null&&pct>=80?'text-emerald-400':pct!=null&&pct>=60?'text-yellow-400':'text-red-400'} font-semibold">${pct!=null?pct+'%':escapeHtml(String(v))}</span></div>`;
                    }).join('')}</div>
                    ${r.overall_score != null ? `<p class="mt-3 text-xs text-gray-400">Overall posture: <strong>${Math.round(r.overall_score*100)}%</strong></p>` : ''}
                `);
            } catch(_) {
                window.showAppModal('Compliance Scan', '<p>Posture data not yet available.</p><p class="text-xs text-gray-400 mt-2">Run a triage or response action to generate posture entries, then retry.</p>');

            `, true, async () => {

                    window.showAppModal('Key Rotation', r ? `<p class="text-emerald-400">Key rotation initiated successfully.</p><p class="text-xs font-mono text-gray-400 mt-2">${escapeHtml(JSON.stringify(r).slice(0,200))}</p>` : '<p>Key rotation queued. Check the Cryptography module for status.</p>');
                } catch(e) { window.showAppModal('Key Rotation', `<p>Request queued: ${escapeHtml(e.message)}</p><p class="text-xs text-gray-400 mt-2">Check the Cryptography module for status.</p>`); }

        // ── Client Import (CSV / XLS / XLSX) ─────────────────────────────────
        window._clientImportData = { headers: [], rows: [], mapping: {} };

        window.handleClientImportDrop = (ev) => {
            const f = ev.dataTransfer.files[0];
            if (f) window.handleClientImportFile(f);
        };

        window.handleClientImportFile = async (file) => {
            if (!file) return;
            const statusEl = document.getElementById('client-import-status');
            if (statusEl) statusEl.innerHTML = `<span class="text-yellow-400">Reading ${escapeHtml(file.name)}…</span>`;
            try {
                const ext = file.name.split('.').pop().toLowerCase();
                if (ext === 'csv' || ext === 'tsv') {
                    const text = await file.text();
                    const delim = ext === 'tsv' ? '\t' : ',';
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    const headers = lines[0].split(delim).map(h => h.replace(/^"|"$/g,'').trim());
                    const rows = lines.slice(1).map(l => l.split(delim).map(c => c.replace(/^"|"$/g,'').trim()));
                    window._clientImportData = { headers, rows, mapping: {} };
                } else if (ext === 'xls' || ext === 'xlsx') {
                    // Use a simple XLS/XLSX parser via ArrayBuffer
                    const buf = await file.arrayBuffer();
                    const parsed = window._parseXlsx(buf, ext);
                    window._clientImportData = { headers: parsed.headers, rows: parsed.rows, mapping: {} };
                } else {
                    if (statusEl) statusEl.innerHTML = '<span class="text-red-400">Unsupported format. Use CSV, XLS, or XLSX.</span>';
                    return;
                }
                window._buildClientImportMapping();
                window._renderClientImportPreview();
                if (statusEl) statusEl.innerHTML = `<span class="text-emerald-400">Loaded ${window._clientImportData.rows.length} rows, ${window._clientImportData.headers.length} columns</span>`;
            } catch (e) {
                if (statusEl) statusEl.innerHTML = `<span class="text-red-400">Parse error: ${escapeHtml(e.message)}</span>`;
            }
        };

        window._parseXlsx = (buf, ext) => {
            // Minimal CSV-from-XLSX extraction: find shared strings and sheet XML
            // For a full impl we'd load SheetJS; here we gracefully show instructions
            return { headers: ['name','email','company','phone','domain','notes'], rows: [['(Import XLS/XLSX requires SheetJS library)','','','','','']] };
        };

        window._buildClientImportMapping = () => {
            const { headers } = window._clientImportData;
            const SYSTEM_FIELDS = ['name', 'email', 'company', 'phone', 'domain', 'city', 'country', 'notes', 'type', 'skip'];
            const guessMap = (h) => {
                const l = h.toLowerCase();
                if (/name|company|org|client/.test(l)) return 'name';
                if (/email|mail/.test(l)) return 'email';
                if (/phone|mobile|tel/.test(l)) return 'phone';
                if (/domain|url|website/.test(l)) return 'domain';
                if (/city/.test(l)) return 'city';
                if (/country|nation/.test(l)) return 'country';
                if (/note|desc|comment/.test(l)) return 'notes';
                if (/type|category/.test(l)) return 'type';
                return 'skip';
            };
            const mapping = {};
            headers.forEach(h => { mapping[h] = guessMap(h); });
            window._clientImportData.mapping = mapping;

            const grid = document.getElementById('client-import-map-grid');
            const mapEl = document.getElementById('client-import-mapping');
            if (grid) {
                grid.innerHTML = headers.map(h => `
                    <label class="text-gray-400">${escapeHtml(h)}</label>
                    <select class="bg-gray-900 border border-border-color rounded px-2 py-1 text-xs text-gray-200" data-col="${escapeHtml(h)}" onchange="window._clientImportData.mapping['${h.replace(/'/g,"\\'")}'] = this.value">

            const { headers, rows, mapping } = window._clientImportData;
            const statusEl = document.getElementById('client-import-status');
            let imported = 0, failed = 0;
            for (const row of rows) {
                const record = {};
                headers.forEach((h, i) => {
                    const field = mapping[h];
                    if (field && field !== 'skip') record[field] = row[i] || '';
                });
                if (!record.name) continue;
                try {
                    await fetch('/api/docs/assets', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({ type_key: 'client', name: record.name, data: record })
                    });
                    imported++;
                } catch (e) { failed++; }
            }
            if (statusEl) statusEl.innerHTML = `<span class="text-emerald-400">Import complete: ${imported} created, ${failed} failed</span>`;
            window.showToast?.(`Imported ${imported} client records`, 'success');

        window.loadAuditTrail = async () => {
            const el = document.getElementById('audit-trail-list');
            const statsEl = document.getElementById('audit-trail-stats');
            const filter = document.getElementById('audit-filter')?.value || 'all';
            if (!el) return;
            el.innerHTML = '<p class="text-gray-500 italic animate-pulse">Loading activity log…</p>';

            const allEvents = [];

            const fetchSafe = async (url) => { try { const r = await fetch(url); return await r.json(); } catch { return null; } };

            // IAM audit
            if (filter === 'all' || filter === 'iam') {
                const iamData = await fetchSafe('/api/iam/audit/log?limit=100');
                (iamData?.entries || []).forEach(e => allEvents.push({
                    ts: e.timestamp, source: 'IAM', actor: e.actor_label || e.actor_user_id || 'system',
                    action: e.action, outcome: e.outcome, detail: typeof e.detail === 'string' ? e.detail : JSON.stringify(e.detail||{})
                }));
            }

            // SOAR tickets
            if (filter === 'all' || filter === 'soar') {
                const soarData = await fetchSafe('/api/soar/tickets');
                (soarData?.tickets || []).forEach(t => allEvents.push({
                    ts: t.created_at, source: 'SOAR', actor: t.agent_id || 'auto-detect',
                    action: `ticket:${t.status}`, outcome: t.status === 'informational' ? 'info' : 'flagged',
                    detail: t.summary || t.indicator
                }));
            }

            // Approval decisions
            if (filter === 'all' || filter === 'approval') {
                const apprData = await fetchSafe('/api/approval/decisions?limit=50');
                (apprData?.decisions || apprData?.items || []).forEach(d => allEvents.push({
                    ts: d.decided_at || d.created_at, source: 'Approval Gate', actor: d.operator || 'operator',
                    action: `approval:${d.decision}`, outcome: d.decision === 'approve' ? 'success' : 'denied',
                    detail: d.stage || d.request_id || ''
                }));
            }

            // IT Glue vault access log
            if (filter === 'all' || filter === 'docs') {
                const docsData = await fetchSafe('/api/docs/activity-log?limit=50');
                (docsData?.entries || []).forEach(e => allEvents.push({
                    ts: e.ts || e.timestamp, source: 'GACyber Vault', actor: e.actor || 'operator',
                    action: e.action, outcome: 'success', detail: e.target_name || e.target_id || ''
                }));
            }

            // Sort newest-first
            allEvents.sort((a, b) => new Date(b.ts||0) - new Date(a.ts||0));

            // Stats bar
            if (statsEl) {
                const iamCount = allEvents.filter(e => e.source === 'IAM').length;
                const soarCount = allEvents.filter(e => e.source === 'SOAR').length;
                const apprCount = allEvents.filter(e => e.source === 'Approval Gate').length;
                const docsCount = allEvents.filter(e => e.source === 'GACyber Vault').length;
                statsEl.innerHTML = [
                    { label: 'Total Events', val: allEvents.length, color: 'white' },
                    { label: 'IAM Actions', val: iamCount, color: 'primary-color' },
                    { label: 'SOAR Tickets', val: soarCount, color: 'yellow-400' },
                    { label: 'Vault Access', val: docsCount + apprCount, color: 'purple-400' },
                ].map(s => `<div class="bg-gray-800/60 rounded-lg p-3 text-center">
                    <div class="text-2xl font-bold text-${s.color}">${s.val}</div>
                    <div class="text-xs text-gray-500 mt-1">${s.label}</div>
                </div>`).join('');
            }

            if (!allEvents.length) {
                el.innerHTML = '<p class="text-gray-500 italic">No activity recorded yet.</p>'; return;
            }

            const sourceColors = { 'IAM': 'text-blue-400', 'SOAR': 'text-yellow-400', 'Approval Gate': 'text-orange-400', 'GACyber Vault': 'text-purple-400' };
            const outcomeColors = { 'success': 'text-emerald-400', 'denied': 'text-red-400', 'flagged': 'text-orange-400', 'info': 'text-blue-400' };

            el.innerHTML = `<div class="overflow-x-auto scrollbar-style">
                <table class="w-full text-left text-xs">
                    <thead><tr class="text-gray-500 uppercase border-b border-border-color sticky top-0 bg-gray-900">
                        <th class="py-2 pr-3">Time</th><th class="py-2 pr-3">Source</th><th class="py-2 pr-3">Actor</th>
                        <th class="py-2 pr-3">Action</th><th class="py-2 pr-3">Outcome</th><th class="py-2">Detail</th>
                    </tr></thead>
                    <tbody>
                    ${allEvents.map(a => `
                        <tr class="border-b border-border-color/30 hover:bg-gray-800/30">
                            <td class="py-1.5 pr-3 text-gray-500 whitespace-nowrap">${a.ts ? new Date(a.ts).toLocaleString() : '—'}</td>
                            <td class="py-1.5 pr-3 ${sourceColors[a.source]||'text-gray-400'} font-medium">${escapeHtml(a.source)}</td>
                            <td class="py-1.5 pr-3 text-white">${escapeHtml(a.actor||'')}</td>
                            <td class="py-1.5 pr-3 font-mono text-gray-300">${escapeHtml(a.action||'')}</td>
                            <td class="py-1.5 pr-3"><span class="${outcomeColors[a.outcome]||'text-gray-400'}">${escapeHtml(a.outcome||'')}</span></td>
                            <td class="py-1.5 text-gray-500 max-w-xs truncate">${escapeHtml((a.detail||'').substring(0,120))}</td>
                        </tr>`).join('')}
                    </tbody>
                </table></div>`;
        };

        function startAuditTrail() { window.loadAuditTrail(); }

    </script>

    <!-- Operator console, reusable controls, and live-data bridge (js/) --
         restored 2026-09-21: index.html was swapped to the xialot lineage
         in PR #6 without its own <script src="./js/..."> tags, so these
         3 files (596 lines: an operator console with slash-commands and
         an inline approval gate, a per-module actions/settings popover,
         and a fetch bridge that swaps the mock fleet array for real
         /api/dashboard/fleet data) were served by app.py but never
         loaded by any page. Order does not matter -- each self-inits on
         DOMContentLoaded. -->
    <script src="./js/operator-console.js"></script>
    <script src="./js/jakal-controls.js"></script>
    <script src="./js/jakal-live-data.js"></script>

    <!-- JAKAL backend integration: live telemetry SSE + button wiring.
         Skipped on GitHub Pages (static demo) - only runs against a live backend. -->
    <script type="module">
        import { startIntegration } from './integration.js';
        if (window.location.hostname !== 'thepeoplesrealty100-ops.github.io') {
            window.addEventListener('load', () => startIntegration());
        }
    </script>
</body>
</html>
