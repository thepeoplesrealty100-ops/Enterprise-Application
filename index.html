<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Unified Singularity OS</title>
    <!-- Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons --><script src="https://unpkg.com/lucide@latest"></script>
    <!-- Load Chart.js for graphs --><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Load Three.js for 3D Globe --><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load D3.js for force-directed graphs --><script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* Custom Styles for Futuristic Look */
        :root {
            --primary-color: #f97316; /* Orange 600 (was Cyan 500) */
            --primary-glow: rgba(249, 115, 22, 0.5); /* Matching Orange Glow */
            --accent-color: #3b82f6; /* Blue 500 (was Violet 500) */
            --dark-bg-opaque: #111827; /* Gray 900 */
            --mid-bg-opaque: #1f2937; /* Gray 800 */
            --dark-bg-translucent: rgba(17, 24, 39, 0.85); /* Gray 900 with 85% opacity for backdrop-blur effect */
            --mid-bg-translucent: rgba(31, 41, 55, 0.85); /* Gray 800 with 85% opacity */
            --border-color: #374151; /* Gray 700 */
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg-opaque);
            color: #d1d5db; /* Gray 300 */
            overflow: hidden;
        }
        #background-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: black;
        }
        #background-container img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            filter: brightness(0.7);
        }
        #background-container img.active {
            opacity: 0.6; /* Made transparent (was 1) */
        }
        #app {
            backdrop-filter: blur(8px);
            background-color: var(--dark-bg-translucent);
        }
        .sidebar {
            background-color: var(--mid-bg-translucent);
            border-right: 1px solid var(--border-color);
            transition: width 0.3s ease, transform 0.3s ease;
        }
        .sidebar.collapsed {
            width: 4rem; /* 64px */
        }
        .sidebar.collapsed .nav-label,
        .sidebar.collapsed #system-title,
        .sidebar.collapsed #view-title,
        .sidebar.collapsed .nav-category {
            display: none;
        }
        .sidebar.collapsed .nav-link {
            justify-content: center;
        }
        .sidebar.collapsed .nav-link-icon {
            margin-right: 0;
        }
        .sidebar.collapsed #sidebar-logo-icon {
            margin-right: 0;
        }
        .sidebar.collapsed #sidebar-header {
             justify-content: center;
        }
        
        .main-content {
             transition: margin-left 0.3s ease;
             margin-left: 16rem; /* 256px */
        }
        .sidebar.collapsed + .main-content {
            margin-left: 4rem; /* 64px */
        }
        
        .nav-link {
            transition: all 0.2s;
            position: relative;
        }
        .nav-link.active, .nav-link:hover {
            color: white;
            background-color: rgba(31, 41, 55, 0.5);
            border-left: 4px solid var(--primary-color);
            padding-left: calc(1rem - 4px);
        }
        .nav-link:not(.active) {
            border-left: 4px solid transparent;
            padding-left: 1rem;
        }
         .sidebar.collapsed .nav-link.active, .sidebar.collapsed .nav-link:hover {
            padding-left: 0;
            border-left: 4px solid var(--primary-color);
        }
        .sidebar.collapsed .nav-link:not(.active) {
            padding-left: 0;
            border-left: 4px solid transparent;
        }
        
        .card {
            background-color: var(--mid-bg-translucent);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        header, footer {
             background-color: var(--mid-bg-translucent);
        }
        .gauge-ring {
            stroke: var(--primary-color);
            transition: stroke-dashoffset 1s ease-out;
        }
        .gauge-bg {
            stroke: var(--border-color);
        }
        /* Scrollbar styles */
        .scrollbar-style::-webkit-scrollbar { width: 8px; }
        .scrollbar-style::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-style::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .scrollbar-style::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }

        /* Responsive Sidebar for Mobile */
        @media (max-width: 1023px) {
            .sidebar {
                transform: translateX(-100%);
                position: absolute;
                z-index: 50;
                height: 100vh;
                background-color: var(--mid-bg-opaque);
                width: 16rem !important; /* Force width on mobile */
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar.collapsed {
                transform: translateX(-100%);
            }
            .main-content {
                margin-left: 0 !important;
            }
            #sidebar-toggle-desktop {
                display: none;
            }
        }
        
        /* Animation keyframes */
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }
        @keyframes dash-flow {
            to { stroke-dashoffset: 1000; }
        }
        @keyframes pulse-glow {
            0%, 100% { 
                opacity: 0.8;
                text-shadow: 0 0 4px var(--primary-glow);
            }
            50% { 
                opacity: 1;
                text-shadow: 0 0 8px var(--primary-glow);
            }
        }
        .footer-pulse {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        
        /* Threat Matrix Specific Styles */
        .threat-source {
            animation: pulse-dot 1.5s ease-in-out infinite;
            cursor: pointer;
            transition: r 0.3s ease;
        }
        .threat-source:hover { r: 12; }
        .threat-path {
            stroke-dasharray: 4, 4;
            animation: dash-flow 2s linear infinite reverse;
        }
        #world-map-svg .country {
            fill: #374151; /* Gray 700 */
            stroke: #1f2937; /* Gray 800 */
            stroke-width: 0.5;
            transition: fill 0.3s ease;
        }
         #world-map-svg .country:hover {
            fill: var(--primary-color);
        }
        #ucc-graph .link {
            stroke: var(--border-color);
            stroke-opacity: 0.6;
        }
        #ucc-graph .node {
            cursor: pointer;
            transition: transform 0.2s;
        }
        #ucc-graph .node:hover { transform: scale(1.1); }
        #ucc-graph .threat-link {
            stroke-dasharray: 4 2;
            animation: dash-flow 1.5s linear infinite reverse;
        }

        /* Quantum Computer Styles */
        .quantum-gate { cursor: grab; user-select: none; }
        .qubit-lane { border-bottom: 1px solid var(--border-color); }
        .gate-slot { border: 1px dashed var(--border-color); min-height: 40px; }
        .gate-slot.drag-over { background-color: var(--primary-glow); border-style: solid; }
        
        /* Ontology Hub D3 styles */
        #ontology-graph-container .node { cursor: pointer; transition: transform 0.2s; }
        #ontology-graph-container .node:hover { transform: scale(1.2); }
        #ontology-graph-container .link {
            stroke-opacity: 0.6;
            stroke-dasharray: 5 5;
            animation: dash-flow 2s linear infinite;
        }
        
        /* Dashboard Tabs */
        .dashboard-tab {
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .dashboard-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .dashboard-tab-content {
             animation: fadeIn 0.5s ease-out forwards;
        }
        
        /* Settings Tab (within Dashboard) */
        .settings-nav-link {
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .settings-nav-link.active, .settings-nav-link:hover {
            background-color: var(--mid-bg-opaque);
            color: white;
            border-left-color: var(--primary-color);
        }
        
        /* Action Dropdown for Table */
        .action-dropdown {
            position: relative;
        }
        .action-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            z-index: 10;
        }
        .action-dropdown:hover .action-dropdown-menu {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* HORIZON SPECIFIC NEW STYLES */
        .matrix-grid-bg {
            background-image: radial-gradient(circle, rgba(249, 115, 22, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        .horizon-scanline {
            width: 100%; height: 2px; background: rgba(249, 115, 22, 0.1);
            position: absolute; animation: scan 4s linear infinite; pointer-events: none; z-index: 0;
        }
        .glow-orange { box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
        .node-pulse-horizon {
            animation: pulse-horizon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-horizon {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

    </style>
</head>
<body>
    <div id="background-container"></div>
    <div id="app" class="h-screen flex antialiased relative">
        <!-- Sidebar Navigation --><div id="sidebar" class="sidebar w-64 flex-shrink-0 flex flex-col transition-all duration-300 lg:static fixed z-50">
            <!-- Header --><div id="sidebar-header" class="p-4 flex items-center space-x-2 border-b border-border-color justify-start flex-shrink-0">
                 <button id="sidebar-logo-icon" onclick="window.loadPage('admin_global_dashboard')" class="cursor-pointer focus:outline-none focus:ring-2 focus:ring-cyan-400 rounded-full group flex-shrink-0" aria-label="Go to Dashboard">
                    <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Filter for the white glow -->
                            <filter id="white-glow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="4" result="blur"/>
                                <feFlood flood-color="white" flood-opacity="1" result="color"/>
                                <feComposite in="color" in2="blur" operator="in" result="glow"/>
                                <feMerge>
                                    <feMergeNode in="glow"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                            
                            <!-- Gradient for the red/orange ring -->
                            <linearGradient id="event-horizon-ring" x1="0%" y1="50%" x2="100%" y2="50%">
                                <stop offset="0%" stop-color="#FF8C00"/> <!-- Dark Orange -->
                                <stop offset="50%" stop-color="#FFFFFF"/> <!-- White Hotspot -->
                                <stop offset="100%" stop-color="#FF8C00"/>
                            </linearGradient>
                            
                            <!-- Radial Gradient for "Black Opal" sphere -->
                            <radialGradient id="black-opal-sphere">
                                <stop offset="0%" stop-color="#0F0F0F"/>
                                <stop offset="70%" stop-color="#050505"/>
                                <stop offset="90%" stop-color="#1A1A2A"/> <!-- Hint of dark blue/purple -->
                                <stop offset="100%" stop-color="#000000"/>
                            </radialGradient>
                        </defs>
                        
                        <!-- The white glow element -->
                        <circle cx="50" cy="50" r="30" stroke="white" stroke-width="6" fill="none" filter="url(#white-glow)" opacity="0.8"/>
                        
                        <!-- The red/orange ring -->
                        <circle cx="50" cy="50" r="30" stroke="url(#event-horizon-ring)" stroke-width="4" fill="none">
                            <animateTransform 
                                attributeName="transform"
                                attributeType="XML"
                                type="rotate"
                                from="0 50 50"
                                to="360 50 50"
                                dur="10s"
                                repeatCount="indefinite"/>
                        </circle>
                        
                        <!-- The black hole sphere -->
                        <circle cx="50" cy="50" r="26" fill="url(#black-opal-sphere)"/>
                    </svg>
                 </button>
                 <div class="overflow-hidden">
                    <span id="system-title" class="text-xl font-bold text-primary-color tracking-wider whitespace-nowrap">JAKAL</span>
                    <span id="view-title" class="text-xs text-gray-400 block whitespace-nowrap">Admin</span>
                 </div>
            </div>

            <!-- Nav Links -->
            <nav id="app-nav" class="flex flex-col p-2 space-y-0 flex-1 scrollbar-style overflow-y-auto">
                <!-- Navigation links are dynamically injected here -->
            </nav>
            
            <!-- Sidebar Toggle (Desktop) -->
            <div id="sidebar-toggle-desktop" class="p-4 border-t border-border-color flex-shrink-0 hidden lg:flex">
                <button onclick="window.toggleDesktopSidebar()" class="p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded-lg">
                    <i id="sidebar-toggle-icon" data-lucide="chevron-left-circle" class="w-6 h-6 transition-transform duration-300"></i>
                </button>
            </div>
        </div>
        
        <!-- Main Content Area --><div class="main-content flex flex-col flex-1 overflow-hidden">
            <!-- Header --><header class="h-16 flex items-center justify-between p-4 border-b border-border-color flex-shrink-0">
                <button id="sidebar-toggle-mobile" class="lg:hidden text-white focus:outline-none">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="lg:block">
                    <h1 id="header-title" class="text-xl font-semibold text-white">Q'MDYM Automation System</h1>
                </div>
                
                <!-- View Switch & User Info --><div class="flex items-center space-x-4">
                    <div class="p-1 rounded-lg bg-gray-700/50 flex space-x-1">
                        <button id="switch-admin" onclick="window.setView('admin')" class="px-3 py-1 text-xs font-semibold rounded-md bg-primary-color text-white transition-colors">Admin Console</button>
                        <button id="switch-client" onclick="window.setView('client')" class="px-3 py-1 text-xs font-semibold rounded-md text-gray-400 hover:bg-gray-600 transition-colors">Client Portal</button>
                    </div>

                    <div class="relative">
                        <i data-lucide="bell" class="w-6 h-6 text-gray-400 hover:text-white cursor-pointer"></i>
                        <span class="absolute top-0 right-0 block h-2 w-2 rounded-full ring-2 ring-mid-bg-opaque bg-red-500"></span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <img src="https://placehold.co/32x32/f97316/111827?text=OP" class="w-8 h-8 rounded-full border-2 border-primary-color" onerror="this.onerror=null;this.src='https://placehold.co/32x32/f97316/111827?text=U'">
                        <span id="operator-name" class="text-sm font-medium hidden sm:inline">Operator Alpha</span>
                    </div>
                </div>
            </header>

            <!-- Page Content --><main id="content-area" class="flex-1 overflow-y-auto scrollbar-style p-4 lg:p-6 pb-10">
                <!-- Content will be injected here --></main>
             <!-- Footer --><footer class="fixed bottom-0 left-0 right-0 h-8 text-gray-500 text-xs flex items-center justify-center border-t border-border-color z-40">
                <span id="app-footer" class="footer-pulse">Powered by Q'MDYM Technologies Systems. JAKAL OS | Release: Ares v1.0</span>
            </footer>
        </div>
    </div>

    <!-- Modals (Custom UI for Alerts/Confirmations) --><div id="app-modal" class="fixed inset-0 bg-black bg-opacity-75 hidden items-center justify-center z-[100]">
        <div id="modal-content-wrapper" class="card w-96 p-6 rounded-xl shadow-xl border-primary-color/50">
            <h3 id="modal-title" class="text-lg font-bold text-primary-color mb-3">System Alert</h3>
            <div id="modal-message" class="text-gray-300 mb-6 max-h-[60vh] overflow-y-auto scrollbar-style"></div>
            <div id="modal-actions" class="flex justify-end space-x-3">
                <button onclick="window.hideModal()" class="px-4 py-2 text-sm font-semibold rounded-lg bg-gray-700 hover:bg-gray-600 text-white">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Lazy load Firebase modules (Simulated import for single HTML file)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let chartInstances = {};
        let activeIntervals = [];
        let animationFrameId = null;
        let globeGroup;
        let d3Simulations = {}; // Store multiple simulations

        // Global utility for icon rendering
        window.onload = function() {
            lucide.createIcons();
            setupAuthAndDatabase();
            setupBackground();
            setupSidebarControls();
            window.setView('admin'); // Set initial view to Admin Console
        }
        
        // --- Background Image Rotator ---
        function setupBackground() {
            // New static background image of a black hole (Sagittarius A*)
            const imageUrl = 'https://placehold.co/1920x1080/000000/f97316?text=JAKAL+DATA+CORE&font=inter';
            
            const bgContainer = document.getElementById('background-container');
            const img = document.createElement('img');
            img.src = imageUrl;
            img.onerror = () => { 
                img.src = 'https://placehold.co/1920x1080/000000/374151?text=Background+Load+Error'; 
                console.error("Failed to load background image.");
            };
            bgContainer.appendChild(img);

            // Make the image active immediately
            img.classList.add('active');
        }

        // --- Modal Functions (Made global for inline onclick handlers) ---
        window.showAppModal = (title, message, isConfirm = false, onConfirm = () => {}, isLarge = false) => {
            const modal = document.getElementById('app-modal');
            const modalContent = document.getElementById('modal-content-wrapper');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').innerHTML = message;
            const actionsDiv = document.getElementById('modal-actions');
            actionsDiv.innerHTML = ''; 

            if (isLarge) {
                modalContent.classList.remove('w-96');
                modalContent.classList.add('w-11/12', 'max-w-4xl');
            } else {
                modalContent.classList.add('w-96');
                modalContent.classList.remove('w-11/12', 'max-w-4xl');
            }

            if (isConfirm) {
                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'px-4 py-2 text-sm font-semibold rounded-lg bg-red-600 hover:bg-red-700 text-white';
                confirmBtn.textContent = 'Confirm';
                confirmBtn.onclick = () => { onConfirm(); window.hideModal(); };
                actionsDiv.appendChild(confirmBtn);
            }
            
            const closeBtn = document.createElement('button');
            closeBtn.className = 'px-4 py-2 text-sm font-semibold rounded-lg bg-gray-700 hover:bg-gray-600 text-white';
            closeBtn.textContent = isConfirm ? 'Cancel' : 'Close';
            closeBtn.onclick = window.hideModal;
            actionsDiv.appendChild(closeBtn);

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        window.hideModal = () => {
            document.getElementById('app-modal').classList.remove('flex');
            document.getElementById('app-modal').classList.add('hidden');
        }
        // --- End Modal Functions ---

        // --- Gemini API Call Helper ---
        /**
         * A centralized function to call the Gemini API with exponential backoff.
         * @param {object} payload - The complete payload to send to the API.
         * @param {number} [retries=3] - Number of retries for rate limiting or server errors.
         * @param {number} [delay=1000] - Initial delay for backoff (in ms).
         * @returns {Promise<object>} - A promise that resolves to { text, sources, json }.
         */
        async function callGeminiApi(payload, retries = 3, delay = 1000) {
            // Per instructions, apiKey is an empty string and will be populated by the environment.
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    // Check for retryable errors (rate limiting or server-side)
                    if ((response.status === 429 || response.status >= 500) && retries > 0) {
                        // This is an intentional retry, not an error to be logged to the console.
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return callGeminiApi(payload, retries - 1, delay * 2);
                    }
                    // Non-retryable error
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    
                    // 1. Extract sources if grounding was used
                    let sources = [];
                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attr => ({
                                uri: attr.web?.uri,
                                title: attr.web?.title,
                            }))
                            .filter(source => source.uri && source.title); // Ensure valid sources
                    }
                    
                    // 2. Parse JSON if requested
                    let json = null;
                    if (payload.generationConfig?.responseMimeType === 'application/json') {
                        try {
                            json = JSON.parse(text);
                        } catch (e) {
                            console.error("Failed to parse JSON response from API:", text);
                            throw new Error("Failed to parse JSON response from API.");
                        }
                    }
                    
                    // 3. Return all parts
                    return { text, sources, json };

                } else if (result.promptFeedback) {
                     throw new Error(`API call blocked. Reason: ${result.promptFeedback.blockReason}`);
                } else {
                    throw new Error("Invalid response structure from API. No candidate found.");
                }
            } catch (error) {
                console.error("Gemini API call failed:", error);
                throw error; // Re-throw to be caught by the caller
            }
        }
        // --- End Gemini API Call Helper ---


        // --- Firebase Setup (Mandatory Placeholder) ---
        let db, auth, userId;

        async function setupAuthAndDatabase() {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

            if (firebaseConfig) {
                try {
                    setLogLevel('Debug');
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            userId = user.uid;
                        } else {
                            if (initialAuthToken) {
                                await signInWithCustomToken(auth, initialAuthToken);
                            } else {
                                await signInAnonymously(auth);
                            }
                        }
                    });
                } catch (error) {
                    console.error("Firebase initialization failed:", error);
                    userId = crypto.randomUUID();
                }
            } else {
                console.warn("Firebase config not available. Running in local mode.");
                userId = crypto.randomUUID();
            }
        }
        // --- End Firebase Setup ---

        // --- Sidebar Controls ---
        function setupSidebarControls() {
             document.getElementById('sidebar-toggle-mobile').addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });
        }
        
        window.toggleDesktopSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('sidebar-toggle-icon'); // Use the ID to find the icon
            
            if (!icon) {
                console.error("Sidebar toggle icon not found!");
                return;
            }
            
            sidebar.classList.toggle('collapsed');
            
            if (sidebar.classList.contains('collapsed')) {
                icon.style.transform = 'rotate(180deg)';
            } else {
                icon.style.transform = 'rotate(0deg)';
            }
        }


        // --- Page Content Rendering & View Switching Logic ---

            const radius = 50;
            const circumference = 2 * Math.PI * radius;
            
            setTimeout(() => {

                if (circle) {
                    const offset = circumference - (percent / 100) * circumference;
                    circle.style.strokeDashoffset = offset;
                }
            }, 100);

            return `
                <div class="flex flex-col items-center justify-center p-4">
                    <svg class="w-28 h-28 transform -rotate-90" viewBox="0 0 120 120">
                        <circle class="gauge-bg" cx="60" cy="60" r="${radius}" fill="none" stroke-width="10"></circle>
                        <circle id="${id}" class="gauge-ring" cx="60" cy="60" r="${radius}" fill="none" stroke-width="10" 
                                stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"></circle>
                        <text x="60" y="65" fill="white" font-size="16" font-weight="bold" text-anchor="middle" class="rotate-90 origin-center">${percent}%</text>
                    </svg>
                    <span class="mt-2 text-sm font-semibold text-primary-color">${label}</span>

        function startAipLogicCoreSimulations() {
            const ctx = document.getElementById('aip-core-performance-chart')?.getContext('2d');
            if(!ctx) return;
            
            const chartData = {
                labels: ['-30s', '-25s', '-20s', '-15s', '-10s', '-5s', 'Now'],
                datasets: [
                    { label: 'Core-001 (Pred)', data: [70, 72, 75, 73, 78, 80, 75], borderColor: '#34d399', tension: 0.4, fill: false },
                    { label: 'Core-002 (Auto)', data: [40, 45, 42, 48, 45, 50, 45], borderColor: '#60a5fa', tension: 0.4, fill: false },
                    { label: 'Core-004 (Data)', data: [85, 88, 90, 85, 92, 95, 90], borderColor: '#f87171', tension: 0.4, fill: false }
                ]
            };

            chartInstances.aipCoreChart = new Chart(ctx, {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 100, ticks: { color: '#9ca3af' } }, x: { ticks: { color: '#9ca3af' } } },
                    plugins: { legend: { labels: { color: '#d1d5db' } } }
                }
            });
            
            const taskQueueEl = document.getElementById('aip-task-queue');
            const tasks = [
                'TASK: Correlate logs from FIN-LT-04',
                'TASK: Re-baseline user.b behavior model',
                'TASK: Scan 12 new IOCs against historical data',
                'TASK: Optimize power distribution query'
            ];
            let taskIndex = 0;

            const interval = setInterval(() => {
                if(chartInstances.aipCoreChart) {
                    chartInstances.aipCoreChart.data.datasets.forEach(dataset => {
                        dataset.data.shift();
                        const lastValue = dataset.data[dataset.data.length - 1];
                        dataset.data.push(Math.max(20, Math.min(100, lastValue + (Math.random() * 10 - 5))));
                    });
                    chartInstances.aipCoreChart.update();
                }
                
                if (taskQueueEl) {
                    taskQueueEl.innerHTML = generateLogEntry(tasks[taskIndex % tasks.length], 'accent-color', 'lucide-cog') + taskQueueEl.innerHTML;
                    if(taskQueueEl.children.length > 10) taskQueueEl.lastElementChild.remove();
                    taskIndex++;
                    lucide.createIcons();
                }
                
            }, 5000);
            activeIntervals.push(interval);
        }

        function startAxiomEdgeSimulation() {
            const lifecycleContainer = document.getElementById('k8s-lifecycle');
            const statusEl = document.getElementById('axiom-edge-status');
            const optimizerLog = document.getElementById('axiom-optimizer-log');

            if (!lifecycleContainer || !statusEl || !optimizerLog) return;

            const stages = [
                { key: 'data-ingest', label: 'Data Ingest', icon: 'database' },
                { key: 'build-train', label: 'Build/Train', icon: 'hammer' },
                { key: 'sec-scan', label: 'Security Scan', icon: 'scan-search' },
                { key: 'deploy', label: 'Deploy', icon: 'send' },
                { key: 'monitor', label: 'Monitor', icon: 'activity' },
            ];

            const optimizerLogs = [
                "Researching new tensor processing architectures for efficiency gains.",
                "Found efficiency gain with 'Federated Learning v2'. Proposing model upgrade.",
                "Initiating automated build for 'AnomalyDetector-v3.2.2'.",
                "Self-healing: Restarting failed pod on edge-node-734.",
                "Analyzing public CVEs for potential impact on container base images.",
                "Pre-fetching next-gen CUDA drivers for sandbox testing."
            ];

            let currentStage = 4; // Start at monitor
            let logIndex = 0;

            const renderLifecycle = () => {
                lifecycleContainer.innerHTML = stages.map((stage, index) => {
                    let statusClass = 'text-gray-500';
                    let statusIcon = 'circle-dashed';
                    if (index < currentStage) {
                        statusClass = 'text-green-500';
                        statusIcon = 'check-circle-2';
                    } else if (index === currentStage) {
                        statusClass = 'text-yellow-500 animate-pulse';
                        statusIcon = 'loader';
                    }
                    
                    let connector = index < stages.length - 1 ? `<div class="w-full h-px bg-gray-700 self-center mb-6 hidden sm:block"></div>` : '';

                    return `
                        <div class="flex-1 flex flex-col sm:flex-row items-center">
                            <div class="flex flex-col items-center text-center w-24 ${statusClass}">
                                <i data-lucide="${statusIcon}" class="w-8 h-8 ${index === currentStage ? 'animate-spin' : ''}"></i>
                                <span class="text-xs font-semibold mt-2">${stage.label}</span>
                            </div>
                            ${connector}
                        </div>
                    `;
                }).join('');
                lucide.createIcons();
            };

            const runCycle = () => {
                currentStage = (currentStage + 1) % (stages.length + 1); // +1 to have a 'done' state
                
                if (currentStage < stages.length) {
                    statusEl.textContent = `STATUS: [${stages[currentStage].label}] - Processing new data batch...`;
                } else {
                    statusEl.textContent = 'STATUS: Monitoring sensor data for drift...';
                    currentStage = 4; // Reset to monitor
                }
                
                renderLifecycle();

                // If cycle is complete, wait before starting a new one
                if (currentStage >= stages.length - 1) { // -1 because monitor is the last stage
                     // stay in monitor
                } else {
                    setTimeout(runCycle, 3000); // 3s per stage
                }
            };
            
            // Initial render
            renderLifecycle();
            optimizerLog.innerHTML += generateLogEntry("Axiom Edge Optimizer Initialized.", 'green-500', 'lucide-power');
            lucide.createIcons();

            // Start optimizer log updates
            const logInterval = setInterval(() => {
                if (document.getElementById('axiom-optimizer-log')) {
                    optimizerLog.innerHTML += generateLogEntry(optimizerLogs[logIndex % optimizerLogs.length], 'purple-400', 'lucide-cpu');
                    optimizerLog.scrollTop = optimizerLog.scrollHeight;
                    lucide.createIcons();
                    logIndex++;
                }
            }, 7000);
            activeIntervals.push(logInterval);

            // After a delay, trigger a new cycle
            setTimeout(() => {
                const logEl = document.getElementById('axiom-optimizer-log');
                if(logEl) {
                    logEl.innerHTML += generateLogEntry("Model drift detected. Initiating upgrade cycle.", 'yellow-400', 'lucide-git-commit-vertical');
                    logEl.scrollTop = logEl.scrollHeight;
                    lucide.createIcons();
                }
                currentStage = -1; // Ready to start from beginning
                runCycle();
            }, 5000);
        }

                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="play" class="w-5 h-5 mr-2"></i>Start Diagnostics';
                    lucide.createIcons();
                    window.showAppModal("Diagnostics Complete", "All systems are nominal. No issues found.");
                    return;
                }
                const checkId = checks[currentCheck];
                const checkEl = document.getElementById(checkId);
                
                if (!checkEl) {
                    console.warn(`Diagnostics element ${checkId} not found. Halting process.`);
                    if(document.getElementById('run-diag-btn')) { 
                        document.getElementById('run-diag-btn').disabled = false;
                        document.getElementById('run-diag-btn').innerHTML = '<i data-lucide="play" class="w-5 h-5 mr-2"></i>Start Diagnostics';
                        lucide.createIcons();
                    }
                    return;
                }

                const iconWrapper = checkEl.querySelector('.diag-icon-wrapper');
                const statusEl = checkEl.querySelector('span:last-child');
                
                if (iconWrapper) {
                    iconWrapper.innerHTML = `<i data-lucide="loader" class="w-full h-full animate-spin text-yellow-500"></i>`;
                }
                statusEl.textContent = 'Checking...';
                statusEl.classList.remove('text-gray-500');
                statusEl.classList.add('text-yellow-500');
                lucide.createIcons();

                setTimeout(() => {
                    const currentCheckEl = document.getElementById(checkId);
                    if (!currentCheckEl) { return; } 
                    
                    const currentIconWrapper = currentCheckEl.querySelector('.diag-icon-wrapper');
                    const currentStatusEl = currentCheckEl.querySelector('span:last-child');
                    
                    if(currentIconWrapper) {
                        currentIconWrapper.innerHTML = `<i data-lucide="check-circle" class="w-full h-full text-green-500"></i>`;
                    }
                    if(currentStatusEl){
                        currentStatusEl.textContent = 'Nominal';
                        currentStatusEl.classList.remove('text-yellow-500');
                        currentStatusEl.classList.add('text-green-500');
                    }
                    lucide.createIcons();
                    currentCheck++;
                    runCheck();
                }, 1500);
            };
            runCheck();
        }

            const sliders = document.querySelectorAll('.energy-slider');
            sliders.forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const changedIndex = parseInt(e.target.dataset.index);
                    const newValue = parseInt(e.target.value);
                    const oldValue = modules[changedIndex].value;
                    const diff = newValue - oldValue;
                    
                    modules[changedIndex].value = newValue;

                    let totalOtherValue = 100 - newValue;
                    let currentOtherSum = modules.reduce((acc, mod, i) => i === changedIndex ? acc : acc + mod.value, 0);
                    
                    modules.forEach((mod, i) => {

                            if (currentOtherSum === 0) { // Avoid division by zero if all others are 0
                                mod.value = Math.floor(totalOtherValue / (modules.length - 1));
                            } else {
                                let proportion = mod.value / currentOtherSum;
                                mod.value = Math.round(totalOtherValue * proportion);
                            }
                        }
                    });

                    // Ensure total is exactly 100
                    let total = modules.reduce((acc, mod) => acc + mod.value, 0);
                    let remainder = 100 - total;
                    if (remainder !== 0) {
                       const nonZeroIndex = modules.findIndex((m, i) => i !== changedIndex && m.value > 0);
                       if(nonZeroIndex !== -1) modules[nonZeroIndex].value += remainder;
                       else modules[changedIndex === 0 ? 1 : 0].value += remainder; // Failsafe
                    }
                    
                    sliders.forEach((s, i) => {

            // Functionality merges the original startThreatMatrix and startUccGraph
            const threatOverlay = document.getElementById('threat-overlay');
            if(threatOverlay) {
                const threatTypes = [
                    { name: 'Adversarial Prompt Injection', color: '#f97316', icon: 'shield-alert', severity: 5 },
                    { name: 'Automated Botnet Swarm', color: '#eab308', icon: 'wifi-off', severity: 4 },
                    { name: 'Data Exfiltration Zero-Day', color: '#ef4444', icon: 'server-crash', severity: 5 },
                    { name: 'Deepfake Phishing Campaign', color: '#8b5cf6', icon: 'message-square-quote', severity: 4 },
                ];

                const interval = setInterval(() => {
                    const originKey = Object.keys(threatOrigins)[Math.floor(Math.random() * Object.keys(threatOrigins).length)];
                    const origin = threatOrigins[originKey];
                    const type = threatTypes[Math.floor(Math.random() * threatTypes.length)];
                    
                    const threatId = `threat-${Date.now()}`;
                    const newThreat = { id: threatId, origin, type };
                    activeThreats.push(newThreat);
                    
                    if (type.severity >= 5 && Math.random() > 0.8) {
                         window.showAppModal(
                            'High-Severity Predictive Threat Detected',
                            `Detected probable <strong>${type.name}</strong> vector originating from <strong>${origin.name}</strong>. The Horizon Engine recommends preemptive network siloing.`,
                            false
                        );
                    }

                    const threatGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    threatGroup.setAttribute('id', threatId);
                    
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute('class', 'threat-path pointer-events-none');
                    path.setAttribute('d', `M${origin.x},${origin.y} Q${(origin.x + targetLocation.x) / 2},${(origin.y + targetLocation.y) / 2 - 100} ${targetLocation.x},${targetLocation.y}`);
                    path.setAttribute('stroke', type.color);
                    path.setAttribute('stroke-width', '2');
                    path.setAttribute('fill', 'none');

                    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circle.setAttribute('class', 'threat-source');
                    circle.setAttribute('cx', origin.x);
                    circle.setAttribute('cy', origin.y);
                    circle.setAttribute('r', 8);
                    circle.setAttribute('fill', type.color);
                    circle.onclick = () => displayThreatDetails(newThreat);
                    
                    threatGroup.appendChild(path);
                    threatGroup.appendChild(circle);
                    threatOverlay.appendChild(threatGroup);

                    const logDiv = document.getElementById('threat-log');
                    if (logDiv) {
                        const logEntryHtml = generateLogEntry(`Predictive Vector: ${type.name} from ${origin.name}`, type.color.replace('#', 'text-[').concat(']'), `lucide-${type.icon}`);
                        logDiv.innerHTML = logEntryHtml + logDiv.innerHTML;
                        lucide.createIcons();
                    }

                    setTimeout(() => {
                        const el = document.getElementById(threatId);
                        if (el) el.remove();
                        activeThreats = activeThreats.filter(t => t.id !== threatId);
                    }, 15000);

                }, 4000);
                activeIntervals.push(interval);
            }
            
            // UCC Graph Logic
            const container = document.getElementById('ucc-graph');
            if(container) {
                const width = container.clientWidth;
                const height = container.clientHeight;
                const svg = d3.select(container);
                
                 const nodes = [
                    { id: "Adversarial AI Model X", group: 'actor', icon: 'cpu' }, { id: "APT-41", group: 'actor', icon: 'bug' },
                    { id: "Beta Corp Data Lake", group: 'client', icon: 'database' }, { id: "Alpha Inc API", group: 'client', icon: 'globe' },
                    { id: "LLM Orchestrator", group: 'asset', icon: 'bot' }, { id: "Auth Gateway", group: 'asset', icon: 'key' },
                    { id: "Zero-Day Injection", group: 'vuln', icon: 'shield-alert' },
                ];
                const links = [
                    { source: "Adversarial AI Model X", target: "Zero-Day Injection", type: 'threat' },
                    { source: "Zero-Day Injection", target: "LLM Orchestrator", type: 'threat' },
                    { source: "LLM Orchestrator", target: "Beta Corp Data Lake", type: 'asset' },
                    { source: "APT-41", target: "Auth Gateway", type: 'threat' },
                    { source: "Auth Gateway", target: "Alpha Inc API", type: 'asset' },
                ];
                
                const color = (group) => {
                    if (group === 'actor') return '#f97316'; // orange
                    if (group === 'client') return '#34d399'; // green
                    if (group === 'asset') return '#60a5fa'; // blue
                    if (group === 'vuln') return '#ef4444'; // red
                    return '#9ca3af';
                };
                
                d3Simulations.ucc = d3.forceSimulation(nodes)
                    .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                    .force("charge", d3.forceManyBody().strength(-200))
                    .force("center", d3.forceCenter(width / 2, height / 2));

                const link = svg.append("g").selectAll("line")
                    .data(links).enter().append("line")
                    .attr("class", d => d.type === 'threat' ? 'threat-link' : 'link')
                    .attr("stroke", d => d.type === 'threat' ? '#f97316' : 'var(--border-color)')
                    .attr("stroke-width", 2);

                const node = svg.append("g").selectAll("g")
                    .data(nodes).enter().append("g").attr("class", "node");
                
                node.append("circle").attr("r", 15).attr("fill", d => color(d.group));
                node.append("foreignObject").attr("width", 20).attr("height", 20).attr("x", -10).attr("y", -10)
                     .html(d => `<i data-lucide="${d.icon}" class="w-5 h-5 text-white"></i>`);
                
                d3Simulations.ucc.on("tick", () => {
                    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)

        function setupInteractiveGlobe() {
            const container = document.getElementById('globe-container');
            if (!container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            camera.position.z = 5;

            globeGroup = new THREE.Group();
            scene.add(globeGroup);

            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const context = canvas.getContext('2d');
            context.fillStyle = 'rgba(249, 115, 22, 0.2)'; // Horizon Orange
            for (let i = 0; i < 6000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                context.beginPath();
                context.arc(x, y, 1.5, 0, Math.PI * 2);
                context.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);

            const geometry = new THREE.SphereGeometry(2, 64, 64);
            const material = new THREE.MeshPhongMaterial({
                map: texture,
                transparent: true,
                opacity: 0.8,
                shininess: 50,
                specular: 0x888888,
            });
            const globe = new THREE.Mesh(geometry, material);
            globeGroup.add(globe);

            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            const starGeometry = new THREE.BufferGeometry();
            const starVertices = [];
            for (let i = 0; i < 10000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                const dist = Math.sqrt(x*x + y*y + z*z);
                if (dist > 100) {
                     starVertices.push(x, y, z);
                }
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0x888888, size: 0.7 });
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            let isMouseDown = false;
            let previousMousePosition = { x: 0, y: 0 };
            container.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                previousMousePosition.x = e.clientX;
                previousMousePosition.y = e.clientY;
                container.classList.add('grabbing');
            });
            container.addEventListener('mouseup', () => {
                isMouseDown = false;
                container.classList.remove('grabbing');
            });
             container.addEventListener('mouseleave', () => {
                isMouseDown = false;
                container.classList.remove('grabbing');
            });
            container.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                globeGroup.rotation.y += deltaX * 0.005;
                globeGroup.rotation.x += deltaY * 0.005;
                previousMousePosition.x = e.clientX;
                previousMousePosition.y = e.clientY;
            });

            function animate() {
                animationFrameId = requestAnimationFrame(animate);
                if(globeGroup) globeGroup.rotation.y += 0.0005;
                if(stars) stars.rotation.y += 0.0001;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                const width = container.clientWidth;
                const height = container.clientHeight;
                if(width > 0 && height > 0) {
                     renderer.setSize(width, height);
                     camera.aspect = width / height;
                     camera.updateProjectionMatrix();
                }
            });
        }

                });

            slots.forEach(slot => {
                slot.addEventListener('dragover', (e) => e.preventDefault());
                slot.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    e.target.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', (e) => {
                    e.target.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    e.target.classList.remove('drag-over');
                    if (draggedItem && e.currentTarget.classList.contains('gate-slot')) {
                        if (e.currentTarget.children.length === 0) {
                             const newGate = draggedItem.cloneNode(true);
                             newGate.style.display = 'flex';
                             newGate.classList.remove('quantum-gate');
                             e.currentTarget.appendChild(newGate);
                        }
                    }
                });
            });
        }

        window.startPenTestSimulation = function() {
            const resultsDiv = document.getElementById('pen-test-results');
            const insightsDiv = document.getElementById('pen-test-insights');
            const logDiv = document.getElementById('pen-test-log');
            const optimizerBtn = document.getElementById('execution-optimizer-btn-pentest');
            const attemptsPill = document.getElementById('pentest-attempts');
            const vulnsPill = document.getElementById('pentest-vulns');
            const depthPill = document.getElementById('pentest-depth');
            const intensity = document.getElementById('test-intensity-sim').value;
            const btn = document.getElementById('pen-test-btn');

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 mr-2 animate-spin"></i> Simulation Running...';
            lucide.createIcons();
            
            resultsDiv.classList.remove('hidden');
            insightsDiv.innerHTML = `<p class="text-yellow-400">Simulation running... identifying vulnerabilities...</p>`;
            logDiv.innerHTML = generateLogEntry('Simulation started.', 'primary-color');
            optimizerBtn.disabled = true;
            optimizerBtn.classList.add('bg-green-800/50', 'text-green-400', 'cursor-not-allowed');
            optimizerBtn.classList.remove('bg-green-600', 'text-white', 'cursor-pointer');

            let iteration = 0;
            let totalVulns = 0;

            const runIteration = () => {
                if (iteration >= parseInt(intensity)) {
                    insightsDiv.innerHTML = `<p><strong>Assessment:</strong> Found ${totalVulns} vulnerabilities. <br> <strong>Resolution:</strong> Autonomous patch deployment via Execution Optimizer is recommended.</p>`;
                    logDiv.innerHTML += generateLogEntry('Simulation complete.', 'primary-color');
                    if (totalVulns > 0) {
                        optimizerBtn.disabled = false;
                        optimizerBtn.classList.remove('bg-green-800/50', 'text-green-400', 'cursor-not-allowed');
                        optimizerBtn.classList.add('bg-green-600', 'text-white', 'cursor-pointer');
                    }
                    btn.disabled = false;
                    btn.textContent = 'Start Ethical Penetration Test Simulation';
                    return;
                }
                
                iteration++;
                const foundVuln = Math.random() > 0.7; 
                if (foundVuln) {
                    totalVulns++;
                    logDiv.innerHTML += generateLogEntry(`Vulnerability found: 'SQL Injection on login endpoint'.`, 'red-500');
                } else {
                    logDiv.innerHTML += generateLogEntry(`Attempt ${iteration}: No new vulnerabilities found.`, 'gray-400');
                }
                logDiv.scrollTop = logDiv.scrollHeight;

                if(attemptsPill) attemptsPill.querySelector('span:last-child').textContent = iteration;
                if(vulnsPill) vulnsPill.querySelector('span:last-child').textContent = totalVulns;
                if(depthPill) depthPill.querySelector('span:last-child').textContent = `${Math.round((iteration / parseInt(intensity)) * 100)}%`;

                setTimeout(runIteration, 200); 
            };
            runIteration();
        }
        
        window.executePenTestOptimization = function() {

        function startOntologySimulation() {
            const container = document.getElementById('ontology-graph-container');
            if(!container) return;

            const width = container.clientWidth;
            const height = container.clientHeight;
            const svg = d3.select(container);
            const tooltip = d3.select('#ontology-tooltip');

            const nodes = [
                { id: "User: j.doe", group: 1, icon: "user", details: "User in Finance Dept." }, 
                { id: "Device: FIN-LT-04", group: 1, icon: "laptop", details: "OS: Windows 11" },
                { id: "Server: DEV-SRV-01", group: 2, icon: "server", details: "OS: Ubuntu 22.04" }, 
                { id: "Database: AuthDB", group: 2, icon: "database", details: "Contains user credentials." },
                { id: "Threat: Malware-XYZ", group: 3, icon: "shield-alert", details: "Type: Ransomware" }, 
                { id: "IP: 1.2.3.4", group: 3, icon: "globe", details: "Known C2 Server" }
            ];
            const links = [
                { source: "User: j.doe", target: "Device: FIN-LT-04", value: 2 },
                { source: "Device: FIN-LT-04", target: "Server: DEV-SRV-01", value: 2 },
                { source: "Server: DEV-SRV-01", target: "Database: AuthDB", value: 2 },
                { source: "Threat: Malware-XYZ", target: "Device: FIN-LT-04", value: 5 },
                { source: "Threat: Malware-XYZ", target: "IP: 1.2.3.4", value: 5 }
            ];
            
            d3Simulations.ontology = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-200))
                .force("center", d3.forceCenter(width / 2, height / 2));

            const link = svg.append("g").selectAll("line")
                .data(links).enter().append("line")
                .attr("class", "link")
                .attr("stroke", "var(--border-color)")
                .attr("stroke-width", d => Math.sqrt(d.value));

            const node = svg.append("g").selectAll("g")
                .data(nodes).enter().append("g").attr("class", "node")
                .call(d3.drag()
                    .on("start", (event, d) => {
                        if (!event.active) d3Simulations.ontology.alphaTarget(0.3).restart();
                        d.fx = d.x; d.fy = d.y;
                    })
                    .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
                    .on("end", (event, d) => {
                        if (!event.active) d3Simulations.ontology.alphaTarget(0);
                        d.fx = null; d.fy = null;
                    })
                )
                .on("mouseover", (event, d) => {
                    tooltip.transition().duration(200).style("opacity", .9);
                    tooltip.html(`<strong>${d.id}</strong><br>${d.details}`)
                        .style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY - 28) + "px");
                    document.getElementById('ontology-node-details').innerHTML = `<p class="font-bold text-white">${d.id}</p><p>${d.details}</p>`;
                })
                .on("mouseout", () => {
                    tooltip.transition().duration(500).style("opacity", 0);
                });
            
            node.append("circle")
                .attr("r", 15)
                .attr("fill", d => d.group === 1 ? '#60a5fa' : d.group === 2 ? '#34d399' : '#f87171');

            node.append("foreignObject")
                 .attr("width", 20).attr("height", 20)
                 .attr("x", -10).attr("y", -10)
                 .html(d => `<i data-lucide="${d.icon}" class="w-5 h-5 text-white"></i>`);
            
            d3Simulations.ontology.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
            lucide.createIcons();
        }

        window.runAipInvestigator = async () => {
            const nodeLayer = document.getElementById('investigation-node-layer');
            const notesEl = document.getElementById('case-notes');
            if(!nodeLayer || !notesEl) return;
            
            notesEl.innerHTML += generateLogEntry('✨ AIP Investigator running...', 'purple-400', 'lucide-sparkles');
            lucide.createIcons();
            notesEl.scrollTop = notesEl.scrollHeight;

            const evidence = Array.from(document.querySelectorAll('.investigation-node'))
                                .map(node => node.textContent.trim().replace(/\s+/g, ' '))
                                .join('; ');
            
            const systemPrompt = "You are an elite AI cybersecurity investigator, part of the 'Horizon' system. You analyze scattered evidence from an ongoing investigation. Your response must be concise, actionable, and formatted as a JSON object with 'analysis' (a short string) and 'nextSteps' (an array of 3 brief strings).";
            const userQuery = `Analyze the following evidence: "${evidence}". Provide a brief analysis and 3 recommended next investigation steps.`;

            const schema = {
                type: "OBJECT",
                properties: {
                    "analysis": { "type": "STRING" },
                    "nextSteps": {
                        "type": "ARRAY",
                        "items": { "type": "STRING" }
                    }
                },
                required: ["analysis", "nextSteps"]
            };

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: schema,
                    temperature: 0.5,
                }
            };

            try {
                const { json } = await callGeminiApi(payload);
                
                notesEl.innerHTML += generateLogEntry(`AIP Analysis: ${json.analysis}`, 'purple-400', 'lucide-brain');
                lucide.createIcons();

                json.nextSteps.forEach((step, index) => {
                    const x = 60 + (index * 5);
                    const y = 30 + (index * 20);
                    addNewInvestigationNode(step, `${x}%`, `${y}%`);
                });

            } catch (error) {
                 console.error("AIP Investigator failed:", error);
                 notesEl.innerHTML += generateLogEntry(`AIP Investigator failed: ${error.message}`, 'red-500', 'lucide-x-circle');
            } finally {
                 notesEl.scrollTop = notesEl.scrollHeight;
                 lucide.createIcons();
            }
        };

        function addNewInvestigationNode(text, x, y) {
            const nodeLayer = document.getElementById('investigation-node-layer');
            if(!nodeLayer) return;
            
            const nodeId = `node-gemini-${Date.now()}`;
            const newNodeHtml = `
                <div id="${nodeId}" class="absolute investigation-node fade-in" style="left: ${x}; top: ${y};">
                    <div class="p-3 bg-purple-800/80 border border-purple-500 rounded-lg text-center shadow-lg">
                        <i data-lucide="sparkles" class="w-6 h-6 mx-auto text-purple-300"></i>
                        <p class="text-xs font-bold text-white mt-1">AIP Next Step</p>
                        <p class="text-xs text-purple-300">${text}</p>
                    </div>
                </div>`;
            
            nodeLayer.innerHTML += newNodeHtml;
            lucide.createIcons();
        }

    </script>
