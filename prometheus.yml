global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'JAKAL-Enterprise'
    environment: 'production'

scrape_configs:
  # JAKAL Backend API
  - job_name: 'jakal-backend'
    static_configs:
      - targets: ['jakal-backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules (optional)
rule_files:
  - '/etc/prometheus/alert_rules.yml'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
