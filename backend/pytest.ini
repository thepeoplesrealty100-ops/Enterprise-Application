[pytest]
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
testpaths = tests
# test_20x_validation.py is a standalone runnable script (has its own __main__
# driver + sys.exit), not a pytest module — run it directly with:
#   python tests/test_20x_validation.py
addopts = --ignore=tests/test_20x_validation.py
