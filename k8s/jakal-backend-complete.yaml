apiVersion: apps/v1
kind: Deployment
metadata:
  name: jakal-backend
  namespace: jakal
  labels:
    app: jakal-backend
    version: v2.8
    tier: backend
  annotations:
    description: "JAKAL Enterprise Backend - Phase 2-5 Complete"
    version: "2.8.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: jakal-backend
      tier: backend
  template:
    metadata:
      labels:
        app: jakal-backend
        tier: backend
        version: v2.8
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: jakal-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Pod Disruption Budget for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - jakal-backend
              topologyKey: kubernetes.io/hostname
      
      # Init containers for database setup
      initContainers:
      - name: db-init
        image: jakal:2.8
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "Initializing database..."
          python /app/backend/seed_demo_data.py
          echo "Database initialized"
        volumeMounts:
        - name: data
          mountPath: /data
        env:
        - name: DATABASE_PATH
          value: "/data/jakal.duckdb"
        - name: LOG_LEVEL
          value: "INFO"
      
      containers:
      - name: backend
        image: jakal:2.8
        imagePullPolicy: IfNotPresent
        
        # Container security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Startup command
        command:
        - /usr/local/bin/python
        - -m
        - uvicorn
        - app:app
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --workers
        - "4"
        
        # Port configuration
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        # Environment variables
        env:
        - name: DATABASE_PATH
          value: "/data/jakal.duckdb"
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENVIRONMENT
          value: "production"
        - name: API_VERSION
          value: "2.8"
        - name: ENABLE_METRICS
          value: "true"
        - name: ENABLE_HEALTH_CHECK
          value: "true"
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: INPUT_VALIDATION_ENABLED
          value: "true"
        - name: SECURITY_HEADERS_ENABLED
          value: "true"
        - name: CACHE_TTL_SECONDS
          value: "60"
        
        # Resource requests and limits
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
            ephemeral-storage: 5Gi
        
        # Liveness probe - restart if unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness probe - remove from traffic if not ready
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 2
        
        # Startup probe - give app time to start
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30  # 150 seconds max startup
        
        # Volume mounts
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        
        # Lifecycle hooks
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]  # Graceful shutdown
      
      # Volumes
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: jakal-data
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: jakal-backend
  namespace: jakal
  labels:
    app: jakal-backend
    tier: backend
  annotations:
    description: "JAKAL Backend Service - Load Balanced"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: jakal-backend
    tier: backend
  sessionAffinity: ClientIP  # Session stickiness
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jakal-data
  namespace: jakal
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast-ssd  # Requires fast-ssd storage class

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jakal-config
  namespace: jakal
data:
  app-config.yaml: |
    # JAKAL Application Configuration
    version: 2.8
    environment: production
    
    # Security
    security:
      rate_limiting:
        enabled: true
        global_limit_per_minute: 1000
        per_endpoint_limit: 100
      
      input_validation:
        enabled: true
        strict_mode: true
      
      security_headers:
        enabled: true
        csp_enabled: true
        hsts_enabled: true
      
      cors:
        enabled: true
        allowed_origins:
        - https://dashboard.jakal.local
        - https://api.jakal.local
    
    # Database
    database:
      type: duckdb
      path: /data/jakal.duckdb
      connections: 10
      query_timeout: 30
      enable_cache: true
      cache_ttl: 60
    
    # Logging
    logging:
      level: INFO
      format: json
      output: stdout
      enable_audit: true
    
    # Features
    features:
      real_time_sync: true
      sse_streaming: true
      api_caching: true
      monitoring: true
      kubernetes: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jakal-backend
  namespace: jakal

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jakal-backend
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jakal-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jakal-backend
subjects:
- kind: ServiceAccount
  name: jakal-backend
  namespace: jakal

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jakal-backend-hpa
  namespace: jakal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jakal-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jakal-backend-pdb
  namespace: jakal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: jakal-backend

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jakal-quota
  namespace: jakal
spec:
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    pods: "50"
    persistentvolumeclaims: "10"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jakal-backend-network-policy
  namespace: jakal
spec:
  podSelector:
    matchLabels:
      app: jakal-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: jakal
    - podSelector:
        matchLabels:
          role: frontend
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: jakal-backend
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
