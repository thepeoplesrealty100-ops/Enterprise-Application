services:
  jakal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jakal-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DUCKDB_PATH=/app/data/jakal.duckdb
      - LLM_ENGINE=${LLM_ENGINE:-ollama}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - IBM_QUANTUM_TOKEN=${IBM_QUANTUM_TOKEN:-}
      - JAKAL_MASTER_KEY=${JAKAL_MASTER_KEY:-}
      # Allow any local UI port (5500, 3000, 5173, …). Same-origin UI on :8000 needs no CORS.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./gacyber_toolkit:/app/gacyber_toolkit:ro
      # Live-edit UI without rebuild (optional)
      - ./index.html:/app/frontend/index.html:ro
      - ./integration.js:/app/frontend/integration.js:ro
    networks:
      - jakal_network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  jakal_network:
    driver: bridge
