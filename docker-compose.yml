version: '3.9'

services:
  jakal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jakal-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - API_PORT=8000
      - DATABASE_URL=data/jakal.duckdb
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - IBM_QUANTUM_TOKEN=${IBM_QUANTUM_TOKEN:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000,https://jakal.vercel.app,https://thepeoplesrealty100-ops.github.io
      - ENABLE_LOCAL_LLM=false
      - ENABLE_QUANTUM_SIMULATION=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./gacyber_toolkit:/app/gacyber_toolkit:ro
    networks:
      - jakal_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  jakal_network:
    driver: bridge

volumes:
  data:
  logs:
  backups:
